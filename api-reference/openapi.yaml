openapi: 3.1.0
info:
  title: Simli
  version: 1.0.0
security:
  - ApiKeyAuth: []
servers:
  - url: https://api.simli.ai/
    description: API server

paths:
  /compose/ice:
    get:
      summary: Get Ice Servers
      description: Create a new set of temporary ICE Server Credentials for WebRTC P2P session
      operationId: getIceServers_compose_ice_get
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  minProperties: 1
                  properties:
                    urls:
                      type: string
                    username:
                      type: string
                    credential:
                      type: string

        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /compose/token:
    post:
      summary: Compose Session Token
      description: Create a temporary Simli Compose Session Token
      operationId: start_audio_to_video_session_compose_token_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartStreamingSessionRequest"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_token:
                    type: string
                  warnings:
                    type: array
                    items:
                      type: string
                    description: >-
                      Starting camera fields outside their supported range, region
                      overrides, and background_id / foreground_id dropped as not
                      your account's (the avatar's own is used). The token is minted
                      regardless.
        "400":
          description: Invalid Data
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_token:
                    type: string
                    description: FAIL TOKEN
                  detail:
                    type: string
                    description: Fail Reason

        "403":
          description: >-
            The face is private and belongs to another account. A face can be
            used by the account that created it, and, when it is public, by
            any account that has its face ID.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: FACE_NOT_ALLOWED
                  reason:
                    type: string
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /static/audio/sign:
    post:
      summary: Sign a Static Video's URLs Again
      description: >-
        Fresh signed URLs for a video made with POST /static/audio, for when the
        ones you have expired. Only the account that made the video can have
        its URLs signed.
      operationId: signStaticUrl_static_audio_sign_post
      parameters:
        - name: x-simli-api-key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  description: >-
                    Either of the video's URLs (hls_url or mp4_url), as returned
                    before. The token on it may have expired, or be left off.
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  hls_url:
                    type: string
                  mp4_url:
                    type: string
                  access_token:
                    type: string
                  access_token_expires_at:
                    type: integer
                    description: Unix time (seconds) the new URLs stop working, 6 hours after the request.
        "401":
          description: Invalid API key
        "404":
          description: The URL is not a video's, or the video is not your account's
  /static/audio:
    post:
      summary: Generate Static Video
      description: >-
        Generate and stream a static video file from a given audio sample. The
        whole request body may be at most 5 MB, and the audio at most 30 minutes
        long. The video is private: the returned URLs are signed (they carry an
        access token valid for 6 hours) and its files are served on a signed
        URL only. POST /static/audio/sign issues fresh ones.
      operationId: audioToVideoInterface_static_audio_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AudioToVideoRequest"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                contentMediaType: application/json
                properties:
                  hls_url:
                    type: string
                    example: "https://api.simli.ai/hls/path-to-file/output.m3u8?token=1794500000.q0J..."
                  mp4_url:
                    type: string
                    example: "https://api.simli.ai/mp4/path-to-file/output.mp4?token=1794500000.q0J..."
                  access_token:
                    type: string
                    description: >-
                      The token both URLs carry as `?token=`. The playlist's segment
                      URLs carry it too.
                  access_token_expires_at:
                    type: integer
                    description: Unix time (seconds) the signed URLs stop working, 6 hours after the request.
                  warnings:
                    type: array
                    items:
                      type: string
                    description: >-
                      Camera fields outside their supported range, and background_id /
                      foreground_id dropped as not your account's (the avatar's own is
                      used). The video is made regardless.
        "413":
          description: The request body is over 5 MB
        "422":
          description: Validation Error, or audio longer than 30 minutes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /static/hls/{destination}/{file}:
    get:
      summary: Get HLS Segment
      security: []
      description: Get HLS Stream of Generated Video
      operationId: getHlsFile_static_hls__destination___file__get
      parameters:
        - name: destination
          in: path
          required: true
          schema:
            type: string
        - name: file
          in: path
          required: true
          schema:
            type: string
            title: File
      responses:
        "200":
          description: Successful Response
          content:
            application/x-mpegURL:
              schema: {}
            video/MP2T:
              schema: {}
        "404":
          description: File not found
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /static/mp4/{destination}/{file}:
    get:
      summary: Get MP4 of Generated Video
      operationId: getMp4_static_mp4__destination___file__get
      security: []
      parameters:
        - name: destination
          in: path
          required: true
          schema:
            type: string
        - name: file
          in: path
          required: true
          schema:
            type: string
            title: File
      responses:
        "200":
          description: Successful Response
          content:
            video/mp4:
              schema: {}
        "404":
          description: File not found

        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /faces/trinity:
    post:
      summary: Generate Trinity Face
      operationId: enqueueGSAGeneration_faces_gs_create_post
      parameters:
        - name: target-ratio
          in: header
          required: false
          description: >-
            The TARGET-RATIO header returned by POST /faces/trinity/preprocess,
            passed back together with the image that call returned. Its presence
            means the image is already framed, so it is used as-is. Omit it when
            posting an image that has not been through preprocess: the image is
            then framed here first, which adds roughly 25 seconds, and the ratio
            is measured rather than taken from you. Preprocess with the same
            gsVersion as this call: the two frame the image differently.
          schema:
            type: number
            format: float
            title: Target Ratio
        - name: gsVersion
          in: query
          required: false
          description: >-
            The avatar generation to make. GSA_2.0 (the default) makes a
            Trinity-2 face and runs on your Trinity-2 generations: one is used
            when the face is built (a failed build uses none), and each
            generation still queued or building holds one meanwhile. One
            account's GSA_2.0 generations start at least 10 minutes apart; a
            request inside that window is accepted at once and held in the
            queue, and the response's dispatch_after says until when. GSA_1.0
            makes a Trinity-1 face and takes one of your plan's face slots; it
            is only available to accounts created before October 26, 2026.
          schema:
            allOf:
              - $ref: "#/components/schemas/TrinityVersion"
            default: GSA_2.0
        - name: face_name
          in: query
          required: false
          schema:
            type: string
            default: untitled_avatar
            title: Face Name
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/Body_enqueueGSAGeneration_faces_gs_create_post"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: The generation's place in the queue, and how long it is held, if it is.
                  face_id:
                    type: string
                    description: The new face's ID. Poll GET /faces/trinity/generation_status with it.
                  dispatch_after:
                    type: integer
                    description: >-
                      GSA_2.0 only, when the generation is held by the 10 minutes
                      between one account's GSA_2.0 generations: the Unix time
                      (seconds) it may start. Absent otherwise.
                  warnings:
                    type: array
                    items:
                      type: string
                required:
                  - message
                  - face_id
                  - warnings
        "403":
          description: >-
            Out of avatars for this gsVersion: with GSA_2.0, you have no
            Trinity-2 generations left; with GSA_1.0, every face slot of your
            plan is taken. Also returned for GSA_1.0 on an account created on or
            after October 26, 2026, which can only make GSA_2.0 faces.
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /faces/trinity/preprocess:
    post:
      summary: Preprocess Trinity Face Image
      description: >-
        Reframes a portrait to the framing its generation expects, and returns the
        reframed PNG. GSA_1.0: the head centred with equal padding above and
        below, squared to the camera, on a simplified version of the image's own
        background. GSA_2.0: the person waist-up, with the torso and both hands,
        on the image's own background. Either way, the image needs someone facing
        the camera.
      operationId: preprocess_image_faces_trinity_preprocess_post
      parameters:
        - name: gsVersion
          in: query
          required: false
          description: >-
            The avatar generation the image is for. Pass the same one to POST
            /faces/trinity. Checks that the account has a Trinity-2 generation
            (GSA_2.0) or a face slot (GSA_1.0) left, as that call does. GSA_1.0
            is only available to accounts created before October 26, 2026.
          schema:
            allOf:
              - $ref: "#/components/schemas/TrinityVersion"
            default: GSA_2.0
        - name: retry
          in: query
          required: false
          description: >-
            Render at higher quality. Substantially slower - roughly 160 seconds
            against 25 - so use it to re-run an image whose first result was
            unsatisfactory rather than as the default.
          schema:
            type: boolean
            default: false
            title: Retry
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/Body_preprocess_image_faces_trinity_preprocess_post"
      responses:
        "200":
          description: >-
            The reframed image. Pass TARGET-RATIO back to POST /faces/trinity as
            the target-ratio header, along with this image, to generate from it.
          headers:
            TARGET-RATIO:
              description: >-
                Tracker ratio measured off the returned image: how much frame
                surrounds the head. Pass it verbatim to POST /faces/trinity as the
                target-ratio header - that call needs it to track the face, and
                its presence also tells the API this image is already framed.
                GSA_2.0 measures none and returns 0; pass it back all the same.
              schema:
                type: number
                format: float
            warnings:
              description: >-
                JSON array of advisory strings. Empty when there is nothing to
                report; the image is still usable when it is not.
              schema:
                type: string
            required-padding:
              description: >-
                JSON object of the padding added around the head, keyed up, down,
                left, right. Always zero now that framing is done by cropping.
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
        "403":
          description: >-
            Out of avatars for this gsVersion: with GSA_2.0, you have no
            Trinity-2 generations left; with GSA_1.0, every face slot of your
            plan is taken. Also returned for GSA_1.0 on an account created on or
            after October 26, 2026, which can only make GSA_2.0 faces.
  /faces/trinity/generation_status:
    get:
      summary: Check Trinity Generation Status
      description: >-
        Status of the caller's Trinity generations. `generations` lists every one
        still tracked, oldest first; the top-level status, queue_position and
        face_id describe the most recent of them. Accounts that generate in
        parallel should read `generations` - the top-level fields only ever
        describe one of several in flight.
      operationId: getRequestStatus_faces_gs_status_get
      parameters:
        - name: face_id
          in: query
          required: false
          description: Limit the response to a single generation.
          schema:
            type: string
            title: Face Id
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrinityGenerationStatus"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /faces:
    get:
      summary: Get all faces
      description: Your own faces only. Other accounts' faces are never listed, public or not.
      responses:
        "200":
          description: List of faces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FacesResponse"

  /face/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Check that a face can be used
      description: >-
        A face can be used by the account that created it, and, when it is
        public, by any account that has its face ID. Public faces are not
        discoverable: no endpoint lists or searches other accounts' faces, so
        another account can use a public face only if it has been given the
        ID.
      responses:
        "200":
          description: The face is yours or public
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaceAccess"
        "400":
          description: Invalid input
        "401":
          description: Unauthorized
        "403":
          description: The face is neither yours nor public
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Face dd57684f-2a27-495b-acee-917a2e5c5ad5 is not yours and is not public"
        "404":
          description: No such face
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Make a face public or private
      description: >-
        A private face can be used only by the account that created it. A
        public face can also be used by any other account that has its face
        ID. Making a face public does not make it discoverable: it is not
        listed or searchable anywhere, and GET /faces returns only your own
        faces, so other accounts can use it only if you give them the ID.
        New faces are private.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacePatchRequest"
      responses:
        "200":
          description: The face, with its new visibility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacesResponse"
        "400":
          description: Invalid input
        "401":
          description: Unauthorized
        "404":
          description: No such face, or it belongs to another account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /faces/trinity/{id}:
    delete:
      summary: Delete a face
      description: Removes a face. This can not be undone. All agents connected to this face_id will be broken
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Face deleted successfully
        "400":
          description: Invalid input
        "401":
          description: Unauthorized
  /assets/{kind}:
    post:
      summary: Upload Background or Foreground
      description: >-
        Uploads an image to show behind your avatars (a background) or over them
        (a foreground). It goes through a content safety check first, which takes
        a few seconds, and one it flags is refused. Stored as PNG, private to your
        account: only your own sessions can use it, by its id, as a session
        token's, a static video's or an Auto session's background_id /
        foreground_id, or in a streaming session's BG_ / FG_ message.
      operationId: uploadAsset_assets__kind__post
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AssetKind"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/Body_uploadAsset_assets__kind__post"
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          description: >-
            The image can't be used: not a JPEG, PNG or WEBP, not 16:9, 9:16 or
            1:1, outside the size limits, a foreground without transparency, or
            flagged by the content safety check. detail says which.
        "401":
          description: Unauthorized
        "413":
          description: The image is 5MB or more
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
        "503":
          description: >-
            The content safety check is unavailable, so nothing was stored. Try
            again.
    get:
      summary: List Backgrounds or Foregrounds
      description: >-
        Your uploaded backgrounds or foregrounds, newest first, each with a
        signed URL that reads the image (a PNG) until url_expires_at, an hour
        on. Anyone holding the URL can read that one image until then, so keep
        it to your own app. List again for fresh URLs.
      operationId: listAssets_assets__kind__get
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AssetKind"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ListedAsset"
        "401":
          description: Unauthorized
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /assets/{kind}/{id}:
    delete:
      summary: Delete a Background or Foreground
      description: >-
        Deletes one of your uploaded backgrounds or foregrounds. This can not be
        undone. A token or agent that names it starts with the avatar's own
        instead.
      operationId: deleteAsset_assets__kind___asset_id__delete
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AssetKind"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not one of your backgrounds / foregrounds
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /integrations/livekit/agents:
    post:
      security: []
      summary: Start Livekit Agents Session
      operationId: init_integrations_livekit_agents_post
      parameters:
        - name: session_token
          in: query
          required: false
          description: >-
            The same Simli session token carried in the request body. Send it
            here as well; the body field remains for older clients, and this
            value takes precedence when both are sent.
          schema:
            type: string
            title: Session Token
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveKitInitializationRequest"
        required: true
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                properties:
                  status:
                    type: string
                  session_id:
                    type: string
                    format: uuid
                  destination:
                    type: string
                    format: base64
        "400":
          description: Session Failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"

  /history/sessions:
    get:
      summary: Retrieve session history
      description: Returns a list of session history records for the authenticated user
      parameters:
        - name: startTime
          in: query
          description: Sessions started at or after this Unix timestamp (default a week ago)
          required: false
          schema:
            type: integer
            example: 1745750387
        - name: endTime
          in: query
          description: Sessions started at or before this Unix timestamp (default now); requires startTime
          required: false
          schema:
            type: integer
            example: 1745750408
      responses:
        "200":
          description: A list of session history records
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/HistoryRecord"
        "400":
          description: endTime without startTime, a timestamp that isn't a number, or a startTime in the future
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized - Invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /ratelimiter/sessions:
    get:
      summary: Active Session Count
      responses:
        "200":
          description: "Active session Count"
          content:
            application/json:
              schema:
                type: object
                properties:
                  currentUsage:
                    type: integer
        "401":
          description: Unauthorized - Invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auto/agent:
    post:
      deprecated: true
      summary: Create New Agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRequest"
      responses:
        "201":
          description: Agent created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResponse"
        "400":
          description: Invalid input
        "403":
          description: The face in face_id is neither yours nor public
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Face dd57684f-2a27-495b-acee-917a2e5c5ad5 is not yours and is not public"
  /auto/agents:
    get:
      deprecated: true
      summary: Get All Agents
      responses:
        "200":
          description: List of agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentResponse"
  /auto/agent/{id}:
    parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
          format: uuid
    get:
      deprecated: true
      summary: Get Agent
      responses:
        "200":
          description: A single agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResponse"
    put:
      summary: Update Agent
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentUpdate"
      responses:
        "200":
          description: Agent updated successfully
        "403":
          description: The face in face_id is neither yours nor public
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Face dd57684f-2a27-495b-acee-917a2e5c5ad5 is not yours and is not public"
        "404":
          description: Agent not found
    delete:
      summary: Delete Agent
      deprecated: true
      responses:
        "204":
          description: Agent deleted successfully
        "404":
          description: Agent not found
  /auto/token:
    post:
      summary: Create Simli Auto Session Token
      description: >-
        A session token for Simli Auto, minted on your server with your API
        key so the key never reaches the page. Carrying the session's
        `request` (the fields of POST /auto/start/configurable's body), it is
        the websocket start on its own: the page sends
        `{"sessionToken": ...}` as the /auto/webrtc/{transport} websocket's
        first message, and the session is the one minted. Without one it
        starts a saved agent's session, sent with the agent's id as GET
        /auto/start/{agent_id} takes them. `expiryStamp` (Unix seconds)
        makes it short-lived; `originAllowList` names the pages that may
        start with it. A key and a face are remembered for the mints that
        follow, so a repeat mint waits on nothing but the sealing.
      deprecated: true
      operationId: createPipecatSessionToken_auto_token_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_token:
                    type: string
                  warnings:
                    type: array
                    items:
                      type: string
                    description: >-
                      Starting camera fields outside their supported range, and
                      background_id / foreground_id dropped as not your account's
                      (the avatar's own is used). The token is minted regardless.
                  model:
                    anyOf:
                      - type: string
                        enum: [trinity2, trinity1]
                      - type: "null"
                    description: >-
                      The face's generation, for a token carrying its request:
                      connect the websocket with `?model=` set to it, which
                      routes the start to a node serving the face.

        "403":
          description: >-
            The face is private and belongs to another account. A face can be
            used by the account that created it, and, when it is public, by
            any account that has its face ID.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: FACE_NOT_ALLOWED
                  reason:
                    type: string
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /auto/start/configurable:
    post:
      summary: Start Auto Session
      description: Start new Simli Auto Session without preconfigured agent
      deprecated: true
      operationId: startPipecatSession_auto_start_configurable_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigurableSessionRequest"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetails"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /auto/start/{agent_id}/{session_token}:
    get:
      security: []
      summary: Start Auto Session from config
      deprecated: true
      operationId: startAgentIDQuery_auto_start__agent_id___session_token__post
      parameters:
        - name: agent_id
          in: path
          required: true
