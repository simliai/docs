openapi: 3.1.0
info:
  title: Simli
  version: 1.0.0
security:
  - ApiKeyAuth: []
servers:
  - url: https://api.simli.ai/
    description: API server

paths:
  /compose/ice:
    get:
      summary: Get Ice Servers
      description: Create a new set of temporary ICE Server Credentials for WebRTC P2P session
      operationId: getIceServers_compose_ice_get
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  minProperties: 1
                  properties:
                    urls:
                      type: string
                    username:
                      type: string
                    credential:
                      type: string

        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /compose/token:
    post:
      summary: Compose Session Token
      description: Create a temporary Simli Compose Session Token
      operationId: start_audio_to_video_session_compose_token_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartStreamingSessionRequest"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_token:
                    type: string
                  warnings:
                    type: array
                    items:
                      type: string
                    description: >-
                      Starting camera fields outside their supported range, region
                      overrides, and background_id / foreground_id dropped as not
                      your account's (the avatar's own is used). The token is minted
                      regardless.
        "400":
          description: Invalid Data
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_token:
                    type: string
                    description: FAIL TOKEN
                  detail:
                    type: string
                    description: Fail Reason

        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /static/audio:
    post:
      summary: Generate Static Video
      description: Generate and stream a static video file from a given audio sample
      operationId: audioToVideoInterface_static_audio_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AudioToVideoRequest"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                contentMediaType: application/json
                properties:
                  hls_url:
                    type: string
                    example: "https://api.simli.ai/hls/path-to-file/output.m3u8"
                  mp4_url:
                    type: string
                    example: "https://api.simli.ai/mp4/path-to-file/output.mp4"
                  warnings:
                    type: array
                    items:
                      type: string
                    description: >-
                      Camera fields outside their supported range, and background_id /
                      foreground_id dropped as not your account's (the avatar's own is
                      used). The video is made regardless.
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /static/hls/{destination}/{file}:
    get:
      summary: Get HLS Segment
      security: []
      description: Get HLS Stream of Generated Video
      operationId: getCachedVideo_static_hls__machineIP___file__get
      parameters:
        - name: destination
          in: path
          required: true
          schema:
            type: string
        - name: file
          in: path
          required: true
          schema:
            type: string
            title: File
      responses:
        "200":
          description: Successful Response
          content:
            application/x-mpegURL:
              schema: {}
            video/MP2T:
              schema: {}
        "404":
          description: File not found
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /static/mp4/{destination}/{file}:
    get:
      summary: Get MP4 of Generated Video
      operationId: getCachedVideoMp4_static_mp4__machineIP___file__get
      security: []
      parameters:
        - name: destination
          in: path
          required: true
          schema:
            type: string
        - name: file
          in: path
          required: true
          schema:
            type: string
            title: File
      responses:
        "200":
          description: Successful Response
          content:
            video/mp4:
              schema: {}
        "404":
          description: File not found

        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /faces/trinity:
    post:
      summary: Generate Trinity Face
      operationId: enqueueGSAGeneration_faces_gs_create_post
      parameters:
        - name: target-ratio
          in: header
          required: false
          description: >-
            The TARGET-RATIO header returned by POST /faces/trinity/preprocess,
            passed back together with the image that call returned. Its presence
            means the image is already framed, so it is used as-is. Omit it when
            posting an image that has not been through preprocess: the image is
            then framed here first, which adds roughly 25 seconds, and the ratio
            is measured rather than taken from you. Preprocess with the same
            gsVersion as this call: the two frame the image differently.
          schema:
            type: number
            format: float
            title: Target Ratio
        - name: gsVersion
          in: query
          required: false
          description: >-
            The avatar generation to make. GSA_1.0 (the default) makes a
            Trinity-1 face and takes one of your plan's face slots. GSA_2.0
            makes a Trinity-2 face and runs on your Trinity-2 generations: one
            is used when the face is built (a failed build uses none), and each
            generation still queued or building holds one meanwhile. One
            account's GSA_2.0 generations start at least 10 minutes apart; a
            request inside that window is accepted at once and held in the
            queue, and the response's dispatch_after says until when.
          schema:
            allOf:
              - $ref: "#/components/schemas/TrinityVersion"
            default: GSA_1.0
        - name: face_name
          in: query
          required: false
          schema:
            type: string
            default: untitled_avatar
            title: Face Name
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/Body_enqueueGSAGeneration_faces_gs_create_post"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: The generation's place in the queue, and how long it is held, if it is.
                  face_id:
                    type: string
                    description: The new face's ID. Poll GET /faces/trinity/generation_status with it.
                  dispatch_after:
                    type: integer
                    description: >-
                      GSA_2.0 only, when the generation is held by the 10 minutes
                      between one account's GSA_2.0 generations: the Unix time
                      (seconds) it may start. Absent otherwise.
                  warnings:
                    type: array
                    items:
                      type: string
                required:
                  - message
                  - face_id
                  - warnings
        "403":
          description: >-
            Out of avatars for this gsVersion: with GSA_1.0, every face slot of
            your plan is taken; with GSA_2.0, you have no Trinity-2 generations
            left.
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /faces/trinity/preprocess:
    post:
      summary: Preprocess Trinity Face Image
      description: >-
        Reframes a portrait to the framing its generation expects, and returns the
        reframed PNG. GSA_1.0: the head centred with equal padding above and
        below, squared to the camera, on a simplified version of the image's own
        background. GSA_2.0: the person waist-up, with the torso and both hands,
        on the image's own background. Either way, the image needs someone facing
        the camera.
      operationId: preprocess_image_faces_trinity_preprocess_post
      parameters:
        - name: gsVersion
          in: query
          required: false
          description: >-
            The avatar generation the image is for. Pass the same one to POST
            /faces/trinity. Checks that the account has a face slot (GSA_1.0) or
            a Trinity-2 generation (GSA_2.0) left, as that call does.
          schema:
            allOf:
              - $ref: "#/components/schemas/TrinityVersion"
            default: GSA_1.0
        - name: retry
          in: query
          required: false
          description: >-
            Render at higher quality. Substantially slower - roughly 160 seconds
            against 25 - so use it to re-run an image whose first result was
            unsatisfactory rather than as the default.
          schema:
            type: boolean
            default: false
            title: Retry
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/Body_preprocess_image_faces_trinity_preprocess_post"
      responses:
        "200":
          description: >-
            The reframed image. Pass TARGET-RATIO back to POST /faces/trinity as
            the target-ratio header, along with this image, to generate from it.
          headers:
            TARGET-RATIO:
              description: >-
                Tracker ratio measured off the returned image: how much frame
                surrounds the head. Pass it verbatim to POST /faces/trinity as the
                target-ratio header - that call needs it to track the face, and
                its presence also tells the API this image is already framed.
                GSA_2.0 measures none and returns 0; pass it back all the same.
              schema:
                type: number
                format: float
            warnings:
              description: >-
                JSON array of advisory strings. Empty when there is nothing to
                report; the image is still usable when it is not.
              schema:
                type: string
            required-padding:
              description: >-
                JSON object of the padding added around the head, keyed up, down,
                left, right. Always zero now that framing is done by cropping.
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
        "403":
          description: >-
            Out of avatars for this gsVersion: with GSA_1.0, every face slot of
            your plan is taken; with GSA_2.0, you have no Trinity-2 generations
            left.
  /faces/trinity/generation_status:
    get:
      summary: Check Trinity Generation Status
      description: >-
        Status of the caller's Trinity generations. `generations` lists every one
        still tracked, oldest first; the top-level status, queue_position and
        face_id describe the most recent of them. Accounts that generate in
        parallel should read `generations` - the top-level fields only ever
        describe one of several in flight.
      operationId: getRequestStatus_faces_gs_status_get
      parameters:
        - name: face_id
          in: query
          required: false
          description: Limit the response to a single generation.
          schema:
            type: string
            title: Face Id
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrinityGenerationStatus"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /faces:
    get:
      summary: Get all faces
      responses:
        "200":
          description: List of faces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FacesResponse"

  /faces/trinity/{id}:
    delete:
      summary: Delete a face
      description: Removes a face. This can not be undone. All agents connected to this face_id will be broken
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Face deleted successfully
        "400":
          description: Invalid input
        "401":
          description: Unauthorized
  /assets/{kind}:
    post:
      summary: Upload Background or Foreground
      description: >-
        Uploads an image to show behind your avatars (a background) or over them
        (a foreground). It goes through a content safety check first, which takes
        a few seconds, and one it flags is refused. Stored as PNG, private to your
        account: only your own sessions can use it, by its id, as a session
        token's, a static video's or an Auto session's background_id /
        foreground_id, or in a streaming session's BG_ / FG_ message.
      operationId: uploadAsset_assets__kind__post
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AssetKind"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/Body_uploadAsset_assets__kind__post"
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          description: >-
            The image can't be used: not a JPEG, PNG or WEBP, not 16:9, 9:16 or
            1:1, outside the size limits, a foreground without transparency, or
            flagged by the content safety check. detail says which.
        "401":
          description: Unauthorized
        "413":
          description: The image is 5MB or more
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
        "503":
          description: >-
            The content safety check is unavailable, so nothing was stored. Try
            again.
    get:
      summary: List Backgrounds or Foregrounds
      description: >-
        Your uploaded backgrounds or foregrounds, newest first, each with a
        signed URL that reads the image (a PNG) until url_expires_at, an hour
        on. Anyone holding the URL can read that one image until then, so keep
        it to your own app. List again for fresh URLs.
      operationId: listAssets_assets__kind__get
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AssetKind"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ListedAsset"
        "401":
          description: Unauthorized
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /assets/{kind}/{id}:
    delete:
      summary: Delete a Background or Foreground
      description: >-
        Deletes one of your uploaded backgrounds or foregrounds. This can not be
        undone. A token or agent that names it starts with the avatar's own
        instead.
      operationId: deleteAsset_assets__kind___asset_id__delete
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AssetKind"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not one of your backgrounds / foregrounds
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /integrations/livekit/agents:
    post:
      security: []
      summary: Start Livekit Agents Session
      operationId: init_integrations_livekit_agents_post
      parameters:
        - name: session_token
          in: query
          required: false
          description: >-
            The same Simli session token carried in the request body. Supplying
            it here as well lets the edge route the request without reading the
            body; the body field remains authoritative for older clients, and
            this value takes precedence when both are sent.
          schema:
            type: string
            title: Session Token
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveKitInitializationRequest"
        required: true
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                properties:
                  status:
                    type: string
                  session_id:
                    type: string
                    format: uuid
                  destination:
                    type: string
                    format: base64
        "400":
          description: Session Failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"

  /history/sessions:
    get:
      summary: Retrieve session history
      description: Returns a list of session history records for the authenticated user
      parameters:
        - name: startTime
          in: query
          description: Filter records from this Unix timestamp
          required: false
          schema:
            type: integer
            example: 1745750387
        - name: endTime
          in: query
          description: Filter records until this Unix timestamp
          required: false
          schema:
            type: integer
            example: 1745750408
      responses:
        "200":
          description: A list of session history records
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/HistoryRecord"
        "401":
          description: Unauthorized - Invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /ratelimiter/sessions:
    get:
      summary: Active Session Count
      responses:
        "200":
          description: "Active session Count"
          content:
            application/json:
              schema:
                type: object
                properties:
                  currentUsage:
                    type: integer
        "401":
          description: Unauthorized - Invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /faces/legacy:
    post:
      summary: Generate Legacy Face
      deprecated: true
      operationId: generateFaceIDAPI_faces_legacy_create_post
      parameters:
        - name: characterVersion
          in: query
          required: false
          schema:
            allOf:
              - $ref: "#/components/schemas/CharacterVersion"
            default: "1.5"
        - name: face_name
          in: query
          required: false
          schema:
            type: string
            default: untitled_avatar
            title: Face Name
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/Body_generateFaceIDAPI_faces_legacy_create_post"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"

  /faces/legacy/{id}:
    delete:
      deprecated: true
      summary: Delete a face
      description: Removes a face. This can not be undone. All agents connected to this face_id will be broken
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Face deleted successfully
        "400":
          description: Invalid input
        "401":
          description: Unauthorized

  /faces/legacy/generation_status:
    get:
      deprecated: true
      summary: Get Legacy Face Generation Status
      operationId: getRequestStatus_faces_legacy_status_get
      parameters:
        - name: face_id
          in: query
          required: false
          schema:
            type: string
            title: Face Id
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"

  /auto/agent:
    post:
      deprecated: true
      summary: Create New Agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRequest"
      responses:
        "201":
          description: Agent created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResponse"
        "400":
          description: Invalid input
  /auto/agents:
    get:
      deprecated: true
      summary: Get All Agents
      responses:
        "200":
          description: List of agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentResponse"
  /auto/agent/{id}:
    parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
          format: uuid
    get:
      deprecated: true
      summary: Get Agent
      responses:
        "200":
          description: A single agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResponse"
    put:
      summary: Update Agent
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentUpdate"
      responses:
        "200":
          description: Agent updated successfully
        "404":
          description: Agent not found
    delete:
      summary: Delete Agent
      deprecated: true
      responses:
        "204":
          description: Agent deleted successfully
        "404":
          description: Agent not found
  /auto/token:
    post:
      summary: Create Simli Auto Session Token
      description: Create a temporary session token for Simli Auto Sessions
      deprecated: true
      operationId: createPipecatSessionToken_auto_token_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_token:
                    type: string
                  warnings:
                    type: array
                    items:
                      type: string
                    description: >-
                      Starting camera fields outside their supported range, and
                      background_id / foreground_id dropped as not your account's
                      (the avatar's own is used). The token is minted regardless.

        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /auto/start/configurable:
    post:
      summary: Start Auto Session
      description: Start new Simli Auto Session without preconfigured agent
      deprecated: true
      operationId: startPipecatSession_auto_start_configurable_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigurableSessionRequest"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetails"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /auto/start/{agent_id}/{session_token}:
    get:
      security: []
      summary: Start Auto Session from config
      deprecated: true
      operationId: startAgentIDQuery_auto_start__agent_id___session_token__post
      parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: string
            title: Agent Id
        - name: session_token
          in: path
          required: true
          schema:
            type: string
            title: Session Token
        - name: redirect
          in: query
          required: false
          schema:
            type: boolean
            default: false
            title: Redirect
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetails"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /auto/start/{agent_id}:
    get:
      security: []
      summary: Start Auto Session from config (token in header)
      description: >-
        Same as /auto/start/{agent_id}/{session_token}, with the session token
        sent in the session-token header instead of the path.
      deprecated: true
      operationId: startAgentIDHeader_auto_start__agent_id__get
      parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: string
            title: Agent Id
        - name: session-token
          in: header
          required: true
          schema:
            type: string
            title: Session-Token
        - name: redirect
          in: query
          required: false
          schema:
            type: boolean
            default: false
            title: Redirect
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetails"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /auto/transcript/{session_id}:
    get:
      summary: Get Simli Auto Transcript
      deprecated: true
      operationId: getE2ETranscript_auto_transcript__session_id__get
      security: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            title: Sessionid
        - name: api-key
          in: header
          required: true
          description: Your Simli API key
          schema:
            type: string
            title: Api-Key
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-simli-api-key

  schemas:
    FacesRequest:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: "Unique identifier for the face, generated by the MySQL service"
        owner_id:
          type: string
          description: "Unique identifier for the owner of the face"
        simli_version:
          type: integer
          description: "Version of the Simli model used for the face"
          example: 1
      required:
        - id
        - owner_id
    FacesResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: "Unique identifier for the face, generated by the MySQL service"
        owner_id:
          type: string
          description: "Unique identifier for the owner of the face"
        simli_version:
          type: integer
          description: "Version of the Simli model used for the face"
          example: 1
        created_at:
          type: string
          format: date-time
          description: "Timestamp when the face was created"
        updated_at:
          type: string
          format: date-time
          description: "Timestamp when the face was last updated"
      required:
        - id
        - owner_id
        - simli_version
        - created_at
        - updated_at
    AgentResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: "Unique identifier for the agent, generated by the MySQL service"
        face_id:
          type: string
          format: uuid
        name:
          type: string
          default: "Untitled Agent"
        first_message:
          type: string
        prompt:
          type: string
        voice_provider:
          type: string
          enum: ["elevenlabs", "cartesia", "inworld"]
        voice_id:
          type: string
          description: "The voice's ID at the voice provider (Inworld voices go by name, such as Sarah)"
        voice_model:
          type: string
          example: sonic-english
        language:
          type: string
        emotion:
          type: string
          format: uuid
        llm_model:
          type: string
          example: gpt-6-luna
        llm_endpoint:
          type: string
          description: "The URL of the custom LLM to use"
          example: https://api.example.com/v1/chat/completions
        max_idle_time:
          type: integer
          default: 300
        max_session_length:
          type: integer
          default: 3600
        owner_id:
          type: string
          description: "Unique identifier for the owner of the agent"
        llm_provider:
          type: string
          enum: ["openai", "google", "user"]
          description: "The provider of the LLM used by the agent"
        simli_version:
          type: integer
          description: "Version of the Simli model used for the face"
          example: 1
        created_at:
          type: string
          format: date-time
          description: "Timestamp when the agent was created"
        updated_at:
          type: string
          format: date-time
          description: "Timestamp when the agent was last updated"
      required:
        - id
        - face_id
        - name
        - first_message
        - prompt
        - voice_provider
        - voice_id
        - voice_model
        - language
        - emotion
        - llm_model
        - llm_endpoint
        - max_idle_time
        - max_session_length
        - owner_id
        - llm_provider
        - created_at
        - updated_at
    AgentRequest:
      type: object
      additionalProperties: false
      properties:
        face_id:
          type: string
          format: uuid
        name:
          type: string
          default: "Untitled Agent"
        first_message:
          type: string
        prompt:
          type: string
        voice_provider:
          type: string
          enum: ["elevenlabs", "cartesia", "inworld"]
        voice_id:
          type: string
          description: "The voice's ID at the voice provider (Inworld voices go by name, such as Sarah)"
        voice_model:
          type: string
          example: sonic-english
        owner_id:
          type: string
          description: "Unique identifier for the owner of the agent"
        language:
          type: string
        emotion:
          type: string
          format: uuid
        llm_model:
          type: string
          example: gpt-6-luna
        llm_endpoint:
          type: string
          description: "The URL of the custom LLM to use"
          example: https://api.example.com/v1/chat/completions
        max_idle_time:
          type: integer
          default: 300
        max_session_length:
          type: integer
          default: 3600
        llm_provider:
          type: string
          enum: ["openai", "google", "user"]
          description: "The provider of the LLM used by the agent"
        created_at:
          type: string
          format: date-time
          description: "Timestamp when the agent was created"
        updated_at:
          type: string
          format: date-time
          description: "Timestamp when the agent was updated"
      required:
        - face_id
        - name
    AgentUpdate:
      type: object
      additionalProperties: false
      properties:
        face_id:
          type: string
          format: uuid
        name:
          type: string
        first_message:
          type: string
        prompt:
          type: string
        voice_provider:
          type: string
          enum: ["elevenlabs", "cartesia", "inworld"]
        voice_id:
          type: string
          description: "The voice's ID at the voice provider (Inworld voices go by name, such as Sarah)"
        voice_model:
          type: string
          example: sonic-english
        llm_model:
          type: string
          example: gpt-6-luna
        llm_endpoint:
          type: string
          description: "The URL of the custom LLM to use"
          example: https://api.example.com/v1/chat/completions
        language:
          type: string
        emotion:
          type: string
          format: uuid
        max_idle_time:
          type: integer
        max_session_length:
          type: integer
        llm_provider:
          type: string
          enum: ["openai", "google", "user"]
          description: "The provider of the LLM used by the agent"
        created_at:
          type: string
          format: date-time
          description: "Timestamp when the agent was created"
        updated_at:
          type: string
          format: date-time
          description: "Timestamp when the agent was updated"
    AudioToVideoRequest:
      properties:
        faceId:
          type: string
          title: Faceid
        audioBase64:
          type: string
          title: Audiobase64
        audioFormat:
          type: string
          enum:
            - pcm16
            - pcm32
            - wav
            - mp3
            - ogg
          title: Audioformat
        audioSampleRate:
          type: integer
          title: Audiosamplerate
          default: 16000
        audioChannelCount:
          type: integer
          title: Audiochannelcount
          default: 1
        videoStartingFrame:
          type: integer
          title: Videostartingframe
          default: 0
        disableSuperRes:
          type: boolean
          title: Disablesuperres
          default: false
          description: Turns off the face restoration pass on legacy faces.
        streaming_width:
          type: integer
          title: Streaming Width
          default: 768
          minimum: 512
          description: >-
            Width of the video in pixels, Trinity-2 faces only (the others
            keep their own frame size). At least 512, and with
            streaming_height one of 1:1, 16:9 or 9:16, otherwise a 422. A
            canvas larger than the avatar's frame is padded with its
            background; a smaller one crops a window out of it.
        streaming_height:
          type: integer
          title: Streaming Height
          default: 768
          minimum: 512
          description: Height of the video in pixels. See streaming_width.
        avatar_position_x:
          type: number
          title: Avatar Position X
          default: 0.5
          minimum: 0
          maximum: 1
          description: >-
            Where the avatar sits across the canvas, from 0 (left) to 1
            (right). Trinity-2 only.
        avatar_position_y:
          type: number
          title: Avatar Position Y
          default: 1.0
          minimum: 0
          maximum: 1
          description: >-
            Where the avatar sits down the canvas, from 0 (top) to 1
            (bottom). Trinity-2 only.
        camera:
          anyOf:
            - $ref: "#/components/schemas/CameraSetting"
            - type: "null"
          description: >-
            The camera the video starts with, on top of the avatar's own
            framing. Trinity-2 only. Leave it out to keep the avatar's
            framing.
        background_id:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
          title: Background Id
          description: >-
            One of your uploaded backgrounds, by the id POST /assets/backgrounds
            returned, to show behind the avatar, cropped to fill the canvas.
            Trinity-2 only. Leave it out for the avatar's own. An id that is not
            one of your account's is dropped with a warning, and the video uses
            the avatar's own. An image is not accepted: upload it first.
        foreground_id:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
          title: Foreground Id
          description: >-
            One of your uploaded foregrounds, by the id POST /assets/foregrounds
            returned, laid over the avatar through its transparency and cropped
            to fill the canvas. Trinity-2 only; otherwise as
            background_id.
      type: object
      required:
        - faceId
        - audioBase64
        - audioFormat
      title: AudioToVideoRequest
    CameraSetting:
      type: object
      title: CameraSetting
      description: >-
        Camera offsets on top of the avatar's own framing. Every field is
        optional and neutral when left out. A value outside its supported
        range is still applied, and the response lists a warning for it;
        NaN and infinity are a 422.
      properties:
        pos_x_off:
          type: number
          default: 0.0
          description: "Moves the avatar right, in half canvas widths. Supported range -10 to 10."
        pos_y_off:
          type: number
          default: 0.0
          description: "Moves the avatar down, in half canvas heights. Supported range -10 to 10."
        pos_z_off:
          type: number
          default: 0.0
          description: "Metres the camera backs away from the avatar (negative moves in). Supported range -5 to 5."
        rot_x_off:
          type: number
          default: 0.0
          description: "Degrees the camera tilts up (pitch). Supported range -180 to 180."
        rot_y_off:
          type: number
          default: 0.0
          description: "Degrees the camera pans right (yaw). Supported range -180 to 180."
        rot_z_off:
          type: number
          default: 0.0
          description: "Degrees the camera rolls clockwise. Supported range -180 to 180."
        zoom:
          type: number
          default: 1.0
          description: "Multiplies the avatar's zoom; 1 is no change. Supported range above 0, up to 4."
        orbit_x_off:
          type: number
          default: 0.0
          description: "Degrees the camera orbits up over the avatar's head (elevation). Supported range -80 to 80."
        orbit_y_off:
          type: number
          default: 0.0
          description: "Degrees the camera orbits round to its right (azimuth). Supported range -180 to 180."
    ConfigurableSessionRequest:
      properties:
        faceId:
          type: string
          title: Faceid
          default: tmp9i8bbq7c
        ttsProvider:
          allOf:
            - $ref: "#/components/schemas/TTS_Provider"
          default: Cartesia
        ttsAPIKey:
          anyOf:
            - type: string
            - type: "null"
          title: Ttsapikey
        ttsModel:
          type: string
          title: Ttsmodel
          default: sonic-turbo-2025-03-07
        voiceId:
          type: string
          title: Voiceid
          default: a167e0f3-df7e-4d52-a9c3-f949145efdab
        systemPrompt:
          anyOf:
            - type: string
            - type: "null"
          title: Systemprompt
          default:
            You are Chatbot, a friendly, helpful robot. Your goal is to demonstrate
            your capabilities in a succinct way. Your output will be converted
            to audio so don't include special characters in your answers.
            Respond to what the user said in a creative and helpful way, but
            keep your responses brief.
        firstMessage:
          anyOf:
            - type: string
            - type: "null"
          title: Firstmessage
        introAnimation:
          anyOf:
            - $ref: "#/components/schemas/AnimationId"
            - type: "null"
          description: >-
            An animation the avatar plays as it opens the session, when the
            user joins (with firstMessage, if there is one). Trinity-2 faces
            only; the others ignore it. Leave it out for no animation.
        maxSessionLength:
          type: integer
          title: Maxsessionlength
          default: 3600
        maxIdleTime:
          type: integer
          title: Maxidletime
          default: 300
        language:
          type: string
          title: Language
          default: en
        customLLMConfig:
          anyOf:
            - $ref: "#/components/schemas/CustomLLMConfig"
            - type: "null"
        llmConfig:
          allOf:
            - $ref: "#/components/schemas/LLMConfig"
          default:
            model: gpt-6-luna
            provider: OpenAI
        createTranscript:
          type: boolean
          title: Createtranscript
          default: false
        model:
          allOf:
            - $ref: "#/components/schemas/SimliModels"
          default: fasttalk
        disableSuperRes:
          type: boolean
          title: Disablesuperres
          default: false
          description: Turns off the face restoration pass on legacy faces.
        streaming_width:
          type: integer
          title: Streaming Width
          default: 768
          minimum: 512
          description: >-
            Width of the streamed video in pixels, Trinity-2 faces only (the others
            keep their own frame size). At least 512, and with
            streaming_height one of 1:1, 16:9 or 9:16, otherwise a 422. A
            canvas larger than the avatar's frame is padded with its
            background; a smaller one crops a window out of it.
        streaming_height:
          type: integer
          title: Streaming Height
          default: 768
          minimum: 512
          description: Height of the streamed video in pixels. See streaming_width.
        avatar_position_x:
          type: number
          title: Avatar Position X
          default: 0.5
          minimum: 0
          maximum: 1
          description: >-
            Where the avatar sits across the canvas, from 0 (left) to 1
            (right). Trinity-2 only.
        avatar_position_y:
          type: number
          title: Avatar Position Y
          default: 1.0
          minimum: 0
          maximum: 1
          description: >-
            Where the avatar sits down the canvas, from 0 (top) to 1
            (bottom). Trinity-2 only.
        camera:
          anyOf:
            - $ref: "#/components/schemas/CameraSetting"
            - type: "null"
          description: >-
            The camera the session starts with, on top of the avatar's own
            framing. Trinity-2 only. Leave it out to keep the avatar's
            framing. A streaming session can move it afterwards with CAM_ messages.
        background_id:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
          title: Background Id
          description: >-
            One of your uploaded backgrounds, by the id POST /assets/backgrounds
            returned, to show behind the avatar, cropped to fill the canvas.
            Trinity-2 only. Leave it out for the avatar's own. An id that is not
            one of your account's is dropped with a warning, and the session uses
            the avatar's own. An image is not accepted: upload it first.
            Your app can change it in the session by sending the room an app
            message {"type": "simli-background", "id": "<background id>"}.
        foreground_id:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
          title: Foreground Id
          description: >-
            One of your uploaded foregrounds, by the id POST /assets/foregrounds
            returned, laid over the avatar through its transparency and cropped
            to fill the canvas. Trinity-2 only; otherwise as
            background_id. Your app can change it with
            {"type": "simli-foreground", "id": "<foreground id>"}.
      type: object
      title: ConfigurableSessionRequest
    CustomLLMConfig:
      properties:
