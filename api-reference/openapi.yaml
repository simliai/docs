          schema:
            type: string
            title: Api-Key
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"

components:
  parameters:
    AgentVariables:
      name: variables
      in: query
      required: false
      description: >-
        The agent's runtime variables, one query param each
        (?name=Ann&city=Paris). The agent marks them in its prompt and first
        message as {{name}} or {{name: default}}; each mark takes the value
        given for its name, or its default (blank without one). A value is at
        most 20 characters. Nothing here refuses the start: a value over 20
        characters, a variable not given and a param that is not one of the
        agent's variables are reported in the response's X-Simli-Variables-*
        headers instead. redirect and model are the route's own params, not
        variables.
      style: form
      explode: true
      schema:
        type: object
        additionalProperties:
          type: string
          maxLength: 20
  headers:
    VariablesDefaulted:
      description: The agent's variables given no value, comma-separated; their defaults went in.
      schema:
        type: string
    VariablesInvalid:
      description: The agent's variables whose value was over 20 characters, comma-separated; their defaults went in.
      schema:
        type: string
    VariablesUnknown:
      description: Query params that are not the agent's variables, comma-separated; unused.
      schema:
        type: string
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-simli-api-key

  schemas:
    FaceAccess:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        simli_version:
          type: integer
          description: "Version of the Simli model used for the face"
          example: 1
        is_public:
          type: boolean
          description: "Whether the face is public: usable by any account that has its face ID, though not listed or discoverable"
        is_owner:
          type: boolean
          description: "Whether the face is your own. When false, you can use it because it is public and you have its ID"
      required:
        - id
        - name
        - simli_version
        - is_public
        - is_owner
    FacePatchRequest:
      type: object
      additionalProperties: false
      properties:
        is_public:
          type: boolean
          description: "true makes the face public (usable by any account that has its face ID; not listed or discoverable), false makes it private (usable only by the account that created it)"
      required:
        - is_public
    FacesResponse:
      type: object
      additionalProperties: false
      properties:
        is_owner:
          type: boolean
          description: "Always true: a face is answered this way to its owner only"
        is_public:
          type: boolean
          description: "Whether the face is public: usable by any account that has its face ID, though not listed or discoverable. A private face is usable only by the account that created it. New faces are private; change it with PATCH /face/{id}"
        is_deleted:
          type: boolean
        name:
          type: string
        id:
          type: string
          format: uuid
          description: "Unique identifier for the face"
        simli_version:
          type: integer
          description: "Version of the Simli model used for the face"
          example: 1
        created_at:
          type: string
          format: date-time
          description: "Timestamp when the face was created"
        updated_at:
          type: string
          format: date-time
          description: "Timestamp when the face was last updated"
      required:
        - id
        - simli_version
        - created_at
        - updated_at
    AgentResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: "Unique identifier for the agent"
        face_id:
          type: string
          format: uuid
        name:
          type: string
          default: "Untitled Agent"
        first_message:
          type: string
        prompt:
          type: string
        voice_provider:
          type: string
          enum: ["elevenlabs", "cartesia", "inworld"]
        voice_id:
          type: string
          description: "The voice's ID at the voice provider (Inworld voices go by name, such as Sarah)"
        voice_model:
          type: string
          example: inworld-tts-2
        language:
          type: string
        emotion:
          type: string
          format: uuid
        llm_model:
          type: string
          example: gpt-6-luna
        llm_endpoint:
          type: string
          description: "The URL of the custom LLM to use"
          example: https://api.example.com/v1/chat/completions
        max_idle_time:
          type: integer
          default: 300
        max_session_length:
          type: integer
          default: 3600
        llm_provider:
          type: string
          enum: ["openai", "google", "user"]
          description: "The provider of the LLM used by the agent. Unset, sessions run openai (gpt-6-luna), or google for a gemini llm_model"
        simli_version:
          type: integer
          description: "Version of the Simli model used for the face"
          example: 1
        created_at:
          type: string
          format: date-time
          description: "Timestamp when the agent was created"
        updated_at:
          type: string
          format: date-time
          description: "Timestamp when the agent was last updated"
      required:
        - id
        - face_id
        - name
        - first_message
        - prompt
        - voice_provider
        - voice_id
        - voice_model
        - language
        - emotion
        - llm_model
        - llm_endpoint
        - max_idle_time
        - max_session_length
        - llm_provider
        - created_at
        - updated_at
    AgentRequest:
      type: object
      additionalProperties: false
      properties:
        face_id:
          type: string
          format: uuid
        name:
          type: string
          default: "Untitled Agent"
        first_message:
          type: string
        prompt:
          type: string
        voice_provider:
          type: string
          enum: ["elevenlabs", "cartesia", "inworld"]
        voice_id:
          type: string
          description: "The voice's ID at the voice provider (Inworld voices go by name, such as Sarah)"
        voice_model:
          type: string
          example: inworld-tts-2
        language:
          type: string
        emotion:
          type: string
          format: uuid
        llm_model:
          type: string
          example: gpt-6-luna
        llm_endpoint:
          type: string
          description: "The URL of the custom LLM to use"
          example: https://api.example.com/v1/chat/completions
        max_idle_time:
          type: integer
          default: 300
        max_session_length:
          type: integer
          default: 3600
        llm_provider:
          type: string
          enum: ["openai", "google", "user"]
          description: "The provider of the LLM used by the agent. Unset, sessions run openai (gpt-6-luna), or google for a gemini llm_model"
        created_at:
          type: string
          format: date-time
          description: "Timestamp when the agent was created"
        updated_at:
          type: string
          format: date-time
          description: "Timestamp when the agent was updated"
      required:
        - face_id
        - name
    AgentUpdate:
      type: object
      additionalProperties: false
      properties:
        face_id:
          type: string
          format: uuid
        name:
          type: string
        first_message:
          type: string
        prompt:
          type: string
        voice_provider:
          type: string
          enum: ["elevenlabs", "cartesia", "inworld"]
        voice_id:
          type: string
          description: "The voice's ID at the voice provider (Inworld voices go by name, such as Sarah)"
        voice_model:
          type: string
          example: inworld-tts-2
        llm_model:
          type: string
          example: gpt-6-luna
        llm_endpoint:
          type: string
          description: "The URL of the custom LLM to use"
          example: https://api.example.com/v1/chat/completions
        language:
          type: string
        emotion:
          type: string
          format: uuid
        max_idle_time:
          type: integer
        max_session_length:
          type: integer
        llm_provider:
          type: string
          enum: ["openai", "google", "user"]
          description: "The provider of the LLM used by the agent. Unset, sessions run openai (gpt-6-luna), or google for a gemini llm_model"
        created_at:
          type: string
          format: date-time
          description: "Timestamp when the agent was created"
        updated_at:
          type: string
          format: date-time
          description: "Timestamp when the agent was updated"
    AudioToVideoRequest:
      properties:
        faceId:
          type: string
          title: Faceid
        audioBase64:
          type: string
          title: Audiobase64
        audioFormat:
          type: string
          enum:
            - pcm16
            - pcm32
            - wav
            - mp3
            - ogg
          title: Audioformat
        audioSampleRate:
          type: integer
          title: Audiosamplerate
          default: 16000
        audioChannelCount:
          type: integer
          title: Audiochannelcount
          default: 1
        videoStartingFrame:
          type: integer
          title: Videostartingframe
          default: 0
        streaming_width:
          type: integer
          title: Streaming Width
          default: 768
          minimum: 512
          description: >-
            Width of the video in pixels, Trinity-2 faces only (the others
            keep their own frame size). At least 512, and with
            streaming_height one of 1:1, 16:9 or 9:16, otherwise a 422. A
            canvas larger than the avatar's frame is padded with its
            background; a smaller one crops a window out of it.
        streaming_height:
          type: integer
          title: Streaming Height
          default: 768
          minimum: 512
          description: Height of the video in pixels. See streaming_width.
        avatar_position_x:
          type: number
          title: Avatar Position X
          default: 0.5
          minimum: 0
          maximum: 1
          description: >-
            Where the avatar sits across the canvas, from 0 (left) to 1
            (right). Trinity-2 only.
        avatar_position_y:
          type: number
          title: Avatar Position Y
          default: 1.0
          minimum: 0
          maximum: 1
          description: >-
            Where the avatar sits down the canvas, from 0 (top) to 1
            (bottom). Trinity-2 only.
        camera:
          anyOf:
            - $ref: "#/components/schemas/CameraSetting"
            - type: "null"
          description: >-
            The camera the video starts with, on top of the avatar's own
            framing. Trinity-2 only. Leave it out to keep the avatar's
            framing.
        background_id:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
          title: Background Id
          description: >-
            One of your uploaded backgrounds, by the id POST /assets/backgrounds
            returned, to show behind the avatar, cropped to fill the canvas.
            Trinity-2 only. Leave it out for the avatar's own. An id that is not
            one of your account's is dropped with a warning, and the video uses
            the avatar's own. An image is not accepted: upload it first.
        foreground_id:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
          title: Foreground Id
          description: >-
            One of your uploaded foregrounds, by the id POST /assets/foregrounds
            returned, laid over the avatar through its transparency and cropped
            to fill the canvas. Trinity-2 only; otherwise as
            background_id.
      type: object
      required:
        - faceId
        - audioBase64
        - audioFormat
      title: AudioToVideoRequest
    CameraSetting:
      type: object
      title: CameraSetting
      description: >-
        Camera offsets on top of the avatar's own framing. Every field is
        optional and neutral when left out. A value outside its supported
        range is still applied, and the response lists a warning for it;
        NaN and infinity are a 422.
      properties:
        pos_x_off:
          type: number
          default: 0.0
          description: "Moves the avatar right, in half canvas widths. Supported range -10 to 10."
        pos_y_off:
          type: number
          default: 0.0
          description: "Moves the avatar down, in half canvas heights. Supported range -10 to 10."
        pos_z_off:
          type: number
          default: 0.0
          description: "Metres the camera backs away from the avatar (negative moves in). Supported range -5 to 5."
        rot_x_off:
          type: number
          default: 0.0
          description: "Degrees the camera tilts up (pitch). Supported range -180 to 180."
        rot_y_off:
          type: number
          default: 0.0
          description: "Degrees the camera pans right (yaw). Supported range -180 to 180."
        rot_z_off:
          type: number
          default: 0.0
          description: "Degrees the camera rolls clockwise. Supported range -180 to 180."
        zoom:
          type: number
          default: 1.0
          description: "Multiplies the avatar's zoom; 1 is no change. Supported range above 0, up to 4."
        orbit_x_off:
          type: number
          default: 0.0
          description: "Degrees the camera orbits up over the avatar's head (elevation). Supported range -80 to 80."
        orbit_y_off:
          type: number
          default: 0.0
          description: "Degrees the camera orbits round to its right (azimuth). Supported range -180 to 180."
    ConfigurableSessionRequest:
      properties:
        faceId:
          type: string
          title: Faceid
          default: 14c60d62-6ebf-424d-b626-1f4f91c33b04
        ttsProvider:
          allOf:
            - $ref: "#/components/schemas/TTS_Provider"
          default: Inworld
        ttsAPIKey:
          anyOf:
            - type: string
            - type: "null"
          title: Ttsapikey
        ttsModel:
          type: string
          title: Ttsmodel
          default: inworld-tts-2
          description: >-
            Defaults to Inworld's model; with ttsProvider Cartesia, to
            sonic-turbo-2025-03-07.
        voiceId:
          type: string
          title: Voiceid
          default: Ashley
          description: >-
            The voice's ID at the voice provider (Inworld voices go by name).
            Defaults to Inworld's Ashley; with ttsProvider Cartesia, to
            a167e0f3-df7e-4d52-a9c3-f949145efdab.
        systemPrompt:
          anyOf:
            - type: string
            - type: "null"
          title: Systemprompt
          default:
            You are Chatbot, a friendly, helpful robot. Your goal is to demonstrate
            your capabilities in a succinct way. Your output will be converted
            to audio so don't include special characters in your answers.
            Respond to what the user said in a creative and helpful way, but
            keep your responses brief.
        firstMessage:
          anyOf:
            - type: string
            - type: "null"
          title: Firstmessage
        introAnimation:
          anyOf:
            - $ref: "#/components/schemas/AnimationId"
            - type: "null"
          description: >-
            An animation the avatar plays as it opens the session, when the
            user joins (with firstMessage, if there is one). Trinity-2 faces
            only; the others ignore it. Leave it out for no animation.
        maxSessionLength:
          type: integer
          title: Maxsessionlength
          default: 3600
        maxIdleTime:
          type: integer
          title: Maxidletime
          default: 300
        language:
          type: string
          title: Language
          default: en
        customLLMConfig:
          anyOf:
            - $ref: "#/components/schemas/CustomLLMConfig"
            - type: "null"
        llmConfig:
          allOf:
            - $ref: "#/components/schemas/LLMConfig"
          default:
            model: gpt-6-luna
            provider: OpenAI
        createTranscript:
          type: boolean
          title: Createtranscript
          default: false
        model:
          allOf:
            - $ref: "#/components/schemas/SimliModels"
          default: fasttalk
        streaming_width:
          type: integer
          title: Streaming Width
          default: 768
          minimum: 512
          description: >-
            Width of the streamed video in pixels, Trinity-2 faces only (the others
            keep their own frame size). At least 512, and with
            streaming_height one of 1:1, 16:9 or 9:16, otherwise a 422. A
            canvas larger than the avatar's frame is padded with its
            background; a smaller one crops a window out of it.
        streaming_height:
          type: integer
          title: Streaming Height
          default: 768
          minimum: 512
          description: Height of the streamed video in pixels. See streaming_width.
        avatar_position_x:
          type: number
          title: Avatar Position X
          default: 0.5
          minimum: 0
          maximum: 1
          description: >-
            Where the avatar sits across the canvas, from 0 (left) to 1
            (right). Trinity-2 only.
        avatar_position_y:
          type: number
          title: Avatar Position Y
          default: 1.0
          minimum: 0
          maximum: 1
          description: >-
            Where the avatar sits down the canvas, from 0 (top) to 1
            (bottom). Trinity-2 only.
        camera:
          anyOf:
            - $ref: "#/components/schemas/CameraSetting"
            - type: "null"
          description: >-
            The camera the session starts with, on top of the avatar's own
            framing. Trinity-2 only. Leave it out to keep the avatar's
            framing. A streaming session can move it afterwards with CAM_ messages.
        background_id:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
          title: Background Id
          description: >-
            One of your uploaded backgrounds, by the id POST /assets/backgrounds
            returned, to show behind the avatar, cropped to fill the canvas.
            Trinity-2 only. Leave it out for the avatar's own. An id that is not
            one of your account's is dropped with a warning, and the session uses
            the avatar's own. An image is not accepted: upload it first.
            Your app can change it in the session by sending the room an app
            message {"type": "simli-background", "id": "<background id>"}.
        foreground_id:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
          title: Foreground Id
          description: >-
            One of your uploaded foregrounds, by the id POST /assets/foregrounds
            returned, laid over the avatar through its transparency and cropped
            to fill the canvas. Trinity-2 only; otherwise as
            background_id. Your app can change it with
            {"type": "simli-foreground", "id": "<foreground id>"}.
      type: object
      title: ConfigurableSessionRequest
    CustomLLMConfig:
      properties:
        model:
          type: string
          title: Model
        baseURL:
          type: string
          title: Baseurl
        llmAPIKey:
          type: string
          title: Llmapikey
      type: object
      required:
        - model
        - baseURL
        - llmAPIKey
      title: CustomLLMConfig
    Google_Models:
      type: string
      description: >-
        gemini-3.8-live is speech to speech over Google's Live API. Gemini 2.5
        and older are retired: they're still accepted, and run on
        gemini-3.8-flash.
      enum:
        - gemini-3.8-flash
        - gemini-3.8-live
      title: Google_Models
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: "#/components/schemas/ValidationError"
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LLMConfig:
      properties:
        model:
          anyOf:
            - $ref: "#/components/schemas/OpenAI_Models"
            - $ref: "#/components/schemas/Google_Models"
            - type: string
          title: Model
          default: gpt-6-luna
        provider:
          allOf:
            - $ref: "#/components/schemas/LLM_Provider"
          default: OpenAI
        apiKey:
          anyOf:
            - type: string
            - type: "null"
          title: Apikey
        baseURL:
          anyOf:
            - type: string
            - type: "null"
          title: Baseurl
      type: object
      title: LLMConfig
    LLM_Provider:
      type: string
      enum:
        - OpenAI
        - Google
        - User
      title: LLM_Provider
    LiveKitInitializationRequest:
      properties:
        session_token:
          type: string
          title: Session Token
        livekit_token:
          type: string
          title: Livekit Token
        livekit_url:
          type: string
          title: Livekit Url
      type: object
      required:
        - session_token
        - livekit_token
        - livekit_url
      title: LiveKitInitializationRequest
    AnimationId:
      type: string
      description: >-
        An animation clip a Trinity-2 avatar can play, by the same ID
        everywhere animations are named.
      enum:
        - g003_wave_goodbye_solo
        - speaking_hands_explaining
        - wave
      title: AnimationId
    OpenAI_Models:
      type: string
      description: >-
        gpt-realtime-2.1-mini and gpt-live-1 are speech to speech: they listen
        and speak themselves, so the TTS settings don't apply. The older
        gpt-4o and gpt-4.1 models are still accepted for existing
        integrations.
      enum:
        - gpt-6-luna
        - gpt-realtime-2.1-mini
        - gpt-live-1
      title: OpenAI_Models
    SessionDetails:
      properties:
        roomUrl:
          type: string
          title: Roomurl
        sessionId:
          type: string
          title: Sessionid
        warnings:
          type: array
          items:
            type: string
          description: >-
            Deprecations, starting camera fields outside their supported range,
            and background_id / foreground_id dropped as not your account's (the
            avatar's own is used). The session starts regardless.
      type: object
      required:
        - roomUrl
        - sessionId
      title: SessionDetails
    SimliModels:
      type: string
      enum:
        - fasttalk
      title: SimliModels
    StartStreamingSessionRequest:
      properties:
        faceId:
          type: string
          title: Faceid
        apiVersion:
          type: string
          title: Apiversion
          const: v2
          default: v2
        sessionAggregator:
          anyOf:
            - type: string
            - type: "null"
          title: Sessionaggregator
        handleSilence:
          type: boolean
          title: Handlesilence
          default: true
        maxSessionLength:
          type: integer
          title: Maxsessionlength
          default: 3600
        maxIdleTime:
          type: integer
          title: Maxidletime
          default: 300
        startFrame:
          type: integer
          title: Startframe
          default: 0
        audioInputFormat:
          type: string
          title: Audioinputformat
          default: pcm16
        streaming_width:
          type: integer
          title: Streaming Width
          default: 768
          minimum: 512
          description: >-
            Width of the streamed video in pixels, Trinity-2 faces only (the others
            keep their own frame size). At least 512, and with
            streaming_height one of 1:1, 16:9 or 9:16, otherwise a 422. A
            canvas larger than the avatar's frame is padded with its
            background; a smaller one crops a window out of it.
        streaming_height:
          type: integer
          title: Streaming Height
          default: 768
          minimum: 512
          description: Height of the streamed video in pixels. See streaming_width.
        avatar_position_x:
          type: number
          title: Avatar Position X
          default: 0.5
          minimum: 0
          maximum: 1
          description: >-
            Where the avatar sits across the canvas, from 0 (left) to 1
            (right). Trinity-2 only.
        avatar_position_y:
          type: number
          title: Avatar Position Y
          default: 1.0
          minimum: 0
          maximum: 1
          description: >-
            Where the avatar sits down the canvas, from 0 (top) to 1
            (bottom). Trinity-2 only.
        camera:
          anyOf:
            - $ref: "#/components/schemas/CameraSetting"
            - type: "null"
          description: >-
            The camera the session starts with, on top of the avatar's own
            framing. Trinity-2 only. Leave it out to keep the avatar's
            framing. A streaming session can move it afterwards with CAM_ messages.
        background_id:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
          title: Background Id
          description: >-
            One of your uploaded backgrounds, by the id POST /assets/backgrounds
            returned, to show behind the avatar, cropped to fill the canvas.
            Trinity-2 only. Leave it out for the avatar's own. An id that is not
            one of your account's is dropped with a warning, and the session uses
            the avatar's own. An image is not accepted: upload it first.
            A streaming session can change it afterwards with BG_ messages.
        foreground_id:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
          title: Foreground Id
          description: >-
            One of your uploaded foregrounds, by the id POST /assets/foregrounds
            returned, laid over the avatar through its transparency and cropped
            to fill the canvas. Trinity-2 only; otherwise as
            background_id. A streaming session can change it afterwards
            with FG_ messages.
      type: object
      required:
        - faceId
      title: StartStreamingSessionRequest
    TTS_Provider:
      type: string
      enum:
        - ElevenLabs
        - Cartesia
        - Inworld
        - User
      title: TTS_Provider
    TokenRequest:
      description: >-
        What a Simli Auto session token seals. Either the session's own
        `request`, for the websocket start, or what a saved agent's session
        starts with: the keys, the framing (agents store none of their own)
        and the transcript flag, the agent named at the start.
      properties:
        expiryStamp:
          anyOf:
            - type: integer
            - type: "null"
          title: Expirystamp
          default: -1
          description: >-
            When the token stops starting sessions, in Unix seconds; -1 for
            never. Set it for a short-lived token.
        simliAPIKey:
          type: string
          title: Simliapikey
          default: ""
          description: >-
            The API key the session runs on. Leave it out for the
            x-simli-api-key header's.
        llmAPIKey:
          anyOf:
            - type: string
            - type: "null"
          title: Llmapikey
          default: ""
        ttsAPIKey:
          anyOf:
            - type: string
            - type: "null"
          title: Ttsapikey
          default: ""
        createTranscript:
          type: boolean
          title: Createtranscript
          default: false
        originAllowList:
          anyOf:
            - items:
                type: string
              type: array
              uniqueItems: true
            - type: "null"
          title: Originallowlist
          default: []
          description: >-
            The pages that may start sessions with the token, by host,
            checked against the request's Origin. Leave it out for any.
        request:
          anyOf:
            - $ref: "#/components/schemas/ConfigurableSessionRequest"
            - type: "null"
          description: >-
            The session the token starts on the websocket, as POST
            /auto/start/configurable takes it, carried exactly as set. A
            start with it names no agent, and the request's own keys and
            framing apply, not the token's.
        streaming_width:
          type: integer
          title: Streaming Width
          default: 768
          minimum: 512
          description: >-
            Width of the streamed video in pixels, Trinity-2 faces only (the others
            keep their own frame size). At least 512, and with
            streaming_height one of 1:1, 16:9 or 9:16, otherwise a 422. A
            canvas larger than the avatar's frame is padded with its
            background; a smaller one crops a window out of it.
        streaming_height:
          type: integer
          title: Streaming Height
          default: 768
          minimum: 512
          description: Height of the streamed video in pixels. See streaming_width.
        avatar_position_x:
          type: number
          title: Avatar Position X
          default: 0.5
          minimum: 0
          maximum: 1
          description: >-
            Where the avatar sits across the canvas, from 0 (left) to 1
            (right). Trinity-2 only.
        avatar_position_y:
          type: number
          title: Avatar Position Y
          default: 1.0
          minimum: 0
          maximum: 1
          description: >-
            Where the avatar sits down the canvas, from 0 (top) to 1
            (bottom). Trinity-2 only.
        camera:
          anyOf:
            - $ref: "#/components/schemas/CameraSetting"
            - type: "null"
          description: >-
            The camera the session starts with, on top of the avatar's own
            framing. Trinity-2 only. Leave it out to keep the avatar's
            framing. A streaming session can move it afterwards with CAM_ messages.
        background_id:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
          title: Background Id
          description: >-
            One of your uploaded backgrounds, by the id POST /assets/backgrounds
            returned, to show behind the avatar, cropped to fill the canvas.
            Trinity-2 only. Leave it out for the avatar's own. An id that is not
            one of your account's is dropped with a warning, and the session uses
            the avatar's own. An image is not accepted: upload it first.
            The agent's session starts with it: agents store none of their own.
            Your app can change it in the session by sending the room an app
            message {"type": "simli-background", "id": "<background id>"}.
        foreground_id:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
          title: Foreground Id
          description: >-
            One of your uploaded foregrounds, by the id POST /assets/foregrounds
            returned, laid over the avatar through its transparency and cropped
            to fill the canvas. Trinity-2 only; otherwise as
            background_id. Your app can change it with
            {"type": "simli-foreground", "id": "<foreground id>"}.
      type: object
      title: TokenRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
        - loc
        - msg
        - type
      title: ValidationError
    HistoryRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the session
        face_id:
          type: string
          description: face_id used in session
        kind:
          type: string
          description: Interaction Method
        simliModel:
          type: string
          enum: [Trinity 2, Trinity 1]
          description: The avatar model that served the session; absent on records that don't say
        sessionAggregator:
          type: string
          description: Aggregation identifier provided in request by customer for grouping their end-users; the API key's name (apiKeyName) when the request gave none
        apiKeyName:
          type: string
          description: (optional) Name of the API key used for this session
        sessionTotalTime:
          type: number
          format: double
          description: Total session duration in seconds
        startTime:
          type: integer
          description: Session start time as Unix timestamp
        endTime:
          type: integer
          description: Session end time as Unix timestamp
        endReason:
          type: string
          description: (Simli Auto) Why the session ended, e.g. PARTICIPANT_LEFT, CLIENT_STOPPED, NOBODY_JOINED
        models:
          type: array
          description: (Simli Auto) Every model the session ran
          items:
            $ref: "#/components/schemas/ModelUse"
        metrics:
          $ref: "#/components/schemas/SessionMetrics"
        meteredUsage:
          type: object
          description: >-
            What the session's meters were billed, by service: the LLM and TTS
            when Simli's keys ran them (llmDelegate is the text model GPT-Live
            hands its reasoning to), and Simli Auto's agent fee on every Auto
            session's seconds (a minute at least)
          properties:
            llm:
              $ref: "#/components/schemas/MeterUsage"
            llmDelegate:
              $ref: "#/components/schemas/MeterUsage"
            tts:
              $ref: "#/components/schemas/MeterUsage"
            agent:
              $ref: "#/components/schemas/MeterUsage"
        estimatedCost:
          $ref: "#/components/schemas/EstimatedCost"
      required:
        - id
        - sessionTotalTime
        - startTime
        - endTime
    ModelUse:
      type: object
      properties:
        role:
          type: string
          enum: [llm, tts, stt, speech_to_speech, avatar]
        provider:
          type: string
          example: Azure OpenAI
        model:
          type: string
          example: gpt-realtime-2.1-mini
        simliKey:
          type: boolean
          description: Whether it ran on Simli's key (Simli pays for it) rather than the caller's
    EstimatedCost:
      type: object
      description: >-
        What a billed session came to, approximately, in US dollars: Simli's
        seconds as billed at the account's plan rate, and what its LLM and TTS
        meters charged. It's the same whether credits or the invoice paid for
        it; the invoice rounds its totals, not each session's. Absent on
        sessions that weren't billed and on records from before it was kept.
      properties:
        totalUSD:
          type: number
          example: 0.0453
        byServiceUSD:
          type: object
          description: By service, as in meteredUsage, and simli
          properties:
            simli:
              type: number
            llm:
              type: number
            llmDelegate:
              type: number
            tts:
              type: number
            agent:
              type: number
              description: Simli Auto's agent fee
        simliBilledSeconds:
          type: integer
          description: Simli's seconds as billed (a Trinity session on a paid plan bills a fifth of its seconds, a minute's fifth at least)
        simliPricePerMinute:
          type: number
          description: The plan's rate for Simli's seconds, dollars a minute
    MeterUsage:
      type: object
      description: >-
        What one service's usage meter got. A token meter's value is in its
        own units: the tokens weighted by their list prices over the meter's
        price, so the meter bills what they cost (in whole units).
      properties:
        meter:
          type: string
          example: gpt_6_luna_tokens
        value:
          type: integer
          description: What the meter was given
        connectedSeconds:
          type: integer
          description: Billed by the seconds the session was connected
        speakingSeconds:
          type: number
          description: (TTS) Seconds the avatar spoke
        uncachedInputTokens:
          type: integer
        cachedInputTokens:
          type: integer
        cacheWriteInputTokens:
          type: integer
        outputTokens:
          type: integer
          description: Output tokens, thinking included
        uncachedInputAudioTokens:
          type: integer
          description: (Speech to speech) Audio tokens, priced apart from the text ones above
        cachedInputAudioTokens:
          type: integer
        outputAudioTokens:
          type: integer
        transcribedSeconds:
          type: number
          description: (GPT-Realtime) Seconds of the user's speech transcribed
        transcriptionPricePerMinute:
          type: number
          description: The transcription's list price, dollars per minute
        listPricesPerMillion:
          type: object
          description: The model's list prices used, dollars per 1M tokens (its text's, where it prices audio apart)
          properties:
            input:
              type: number
            cachedInput:
              type: number
            cacheWrite:
              type: number
            output:
              type: number
            audioInput:
              type: number
            cachedAudioInput:
              type: number
            audioOutput:
              type: number
        meterPricePerMillion:
          type: number
          description: The meter's price, dollars per 1M of its units
        costUSD:
          type: number
          description: What the tokens cost at those list prices
    SessionMetrics:
      type: object
      description: (Simli Auto) What the session did. A field is present only where the session's services report it.
      properties:
        startup:
          type: object
          description: Milliseconds from the session's start on Simli's server
          properties:
            firstFrameMs:
              type: integer
              description: To the avatar's first frame
            userJoinedMs:
              type: integer
              description: To the user joining
            firstWordsMs:
              type: integer
              description: To the avatar's first words
        speech:
          type: object
          properties:
            userSeconds:
              type: number
              description: Seconds the user spoke
            avatarSeconds:
              type: number
              description: Seconds the avatar spoke
        turns:
          type: object
          properties:
            user:
              type: integer
            typed:
              type: integer
              description: The user's turns they typed (user-input on the session websocket) instead of saying; counted in user too
            avatar:
              type: integer
            interruptions:
              type: integer
              description: Times the user cut the avatar off
            backchannels:
              type: integer
              description: Short listening sounds ("mhm") the avatar made while the user talked; neither its turns nor replies
        replies:
          type: object
          description: From the end of the user's speech to the avatar's voice, per reply (typed turns' replies aren't counted)
          properties:
            count:
              type: integer
            meanMs:
              type: integer
            p50Ms:
              type: integer
            p90Ms:
              type: integer
            maxMs:
              type: integer
        ttfbMs:
          type: object
          description: Mean time to first byte of each kind of service (stt, llm, tts)
          additionalProperties:
            type: integer
        usage:
          type: object
          properties:
            llm:
              type: object
              description: Tokens the LLM or speech-to-speech model reported
              properties:
                inputTokens:
                  type: integer
                outputTokens:
                  type: integer
                totalTokens:
                  type: integer
                cachedInputTokens:
                  type: integer
                cacheWriteInputTokens:
                  type: integer
                reasoningTokens:
                  type: integer
                inputAudioTokens:
                  type: integer
                outputAudioTokens:
                  type: integer
                cachedInputAudioTokens:
                  type: integer
            tts:
              type: object
              properties:
                characters:
                  type: integer
            stt:
              type: object
              properties:
                audioSeconds:
                  type: number
        toolCalls:
          type: integer
          description: Function calls the model made (knowledge base searches among them)
        errors:
          type: integer

    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
        code:
          type: string
          description: Error code
      required:
        - error
    Body_enqueueGSAGeneration_faces_gs_create_post:
      properties:
        image:
          type: string
          format: binary
          title: Image
      type: object
      required:
        - image
      title: Body_enqueueGSAGeneration_faces_gs_create_post
    Body_preprocess_image_faces_trinity_preprocess_post:
      properties:
        image:
          type: string
          format: binary
          title: Image
          description: >-
            JPEG, PNG or WEBP, under 5MB, at least 512x512. It must contain a
            person facing the camera whose head is at least 15% of the image
            height - a head smaller than that carries too few pixels to keep the
            likeness, and is rejected. Where several people are present, the
            largest camera-facing head is treated as the subject.
      type: object
      required:
        - image
      title: Body_preprocess_image_faces_trinity_preprocess_post
    AssetKind:
      type: string
      enum:
        - backgrounds
        - foregrounds
      title: AssetKind
    Asset:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: What background_id / foreground_id and BG_ / FG_ take.
        name:
          type: string
          title: Name
          description: The uploaded file's name.
        width:
          type: integer
          title: Width
        height:
          type: integer
          title: Height
        size_bytes:
          type: integer
          title: Size Bytes
          description: The stored PNG's size.
        created_at:
          type: integer
          title: Created At
          description: Unix time, in seconds.
      type: object
      required:
        - id
        - name
        - width
        - height
        - size_bytes
        - created_at
      title: Asset
    ListedAsset:
      allOf:
        - $ref: "#/components/schemas/Asset"
        - type: object
          properties:
            url:
              anyOf:
                - type: string
                  format: uri
                - type: "null"
              title: Url
              description: >-
                A signed URL that GETs the image until url_expires_at; usable as
                an <img> src. Null if one couldn't be made just then.
            url_expires_at:
              type: integer
              title: Url Expires At
              description: Unix time, in seconds, when url stops working.
          required:
            - url
            - url_expires_at
      title: ListedAsset
    Body_uploadAsset_assets__kind__post:
      properties:
        image:
          type: string
          format: binary
          title: Image
          description: >-
            JPEG, PNG or WEBP, under 5MB, in one of the streaming canvases'
            shapes: 16:9, 9:16 or 1:1 and no other, at least 512 pixels on its
            shorter side and at most 1920x1080, 1080x1920 or 1080x1080. A
            foreground needs transparency (a PNG or WEBP with an alpha channel).
            EXIF orientation is applied; metadata is dropped.
      type: object
      required:
        - image
      title: Body_uploadAsset_assets__kind__post
    TrinityGenerationState:
      type: string
      enum:
        - not_found
        - pending
        - processing
        - completed
        - failed
      title: TrinityGenerationState
    TrinityGeneration:
      type: object
      properties:
        face_id:
          type: string
          title: Face Id
        status:
          $ref: "#/components/schemas/TrinityGenerationState"
        queue_position:
          type: integer
          title: Queue Position
          description: >-
            Place in the pending queue. 0 once the generation has left the queue
            and is being worked on.
        dispatch_after:
          type: integer
          title: Dispatch After
          description: >-
            GSA_2.0 only, while the generation is pending and held by the 10
            minutes between one account's GSA_2.0 generations: the Unix time
            (seconds) it may start. Absent otherwise.
      required:
        - face_id
        - status
        - queue_position
      title: TrinityGeneration
    TrinityGenerationStatus:
      type: object
      properties:
        status:
          allOf:
            - $ref: "#/components/schemas/TrinityGenerationState"
          description: >-
            Status of the most recent generation, or not_found when none is
            tracked.
        queue_position:
          type: integer
          title: Queue Position
          description: >-
            Queue position of the most recent generation, or -1 when none is
            tracked.
        face_id:
          type: string
          title: Face Id
          description: >-
            The most recent generation's face id. Absent when nothing is tracked
            and no face_id was requested; echoes the requested face_id otherwise.
        generations:
          type: array
          items:
            $ref: "#/components/schemas/TrinityGeneration"
          title: Generations
          description: >-
            Every generation still tracked for the caller, oldest first. Completed
            and failed entries remain listed for 24 hours. Empty when none is
            tracked.
      required:
        - status
        - queue_position
        - generations
      title: TrinityGenerationStatus
    TrinityVersion:
      type: string
      description: >-
        The avatar generation: GSA_2.0 makes a Trinity-2 face, GSA_1.0 a
        Trinity-1 face (accounts created before October 26, 2026 only).
      enum:
        - GSA_1.0
        - GSA_2.0
      title: GSVersion
