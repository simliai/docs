        - $ref: "#/components/parameters/AgentVariables"
      responses:
        "200":
          description: Successful Response
          headers:
            X-Simli-Variables-Defaulted:
              $ref: "#/components/headers/VariablesDefaulted"
            X-Simli-Variables-Invalid:
