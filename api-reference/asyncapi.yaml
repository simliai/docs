asyncapi: 3.0.0
info:
  title: Simli WebSockets
  version: 1.0.0
servers:
  Simli WSS:
    host: "api.simli.ai"
    protocol: wss
    variables:
      session_token:
        description: Session token generated by https://api.simli.ai/compose/token

defaultContentType: text/plain
channels:
  peer_to_peer:
    summary: |
      Peer to Peer WebRTC 

      [Compose Session Token](/api-reference/compose-session-token) is sent as query parameter string

      enableSFU is a query parameter boolean to opt into sending the traffic through cloudflare network for improved reliability

      First message must be offer. Offer must be provided within 30 seconds of opening the websocket. Once offer is sent, a corresponding answer will be sent from the server which can be used as described [here](https://developer.mozilla.org/en-US/docs/Web/API/RTCPeerConnection/setRemoteDescription)
    address: /compose/webrtc/peer_to_peer
    messages:
      offer:
        $ref: "#/components/messages/rtc_offer"
        description: "RTC Offer. Must be first message"
      answer:
        $ref: "#/components/messages/rtc_answer"
        description: "RTC Offer. Must be first message"
      audio_chunk:
        $ref: "#/components/messages/audio_chunk"
      clear_buffer:
        $ref: "#/components/messages/clear_buffer"
      final_message:
        $ref: "#/components/messages/final_message"
      camera:
        $ref: "#/components/messages/camera"
      camera_notice:
        $ref: "#/components/messages/camera_notice"
      event:
        $ref: "#/components/messages/event"
      error:
        $ref: "#/components/messages/error"

  livekit:
    summary: |
      Livekit Backed WebRTC

      [Compose Session Token](/api-reference/compose-session-token) is sent as query parameter string

      No first message is required. However, You must successfully join the livekit room within 30 seconds
    address: /compose/webrtc/livekit
    messages:
      livekit_join_info:
        $ref: "#/components/messages/livekit_join_info"
      audio_chunk:
        $ref: "#/components/messages/audio_chunk"
      clear_buffer:
        $ref: "#/components/messages/clear_buffer"
      final_message:
        $ref: "#/components/messages/final_message"
      camera:
        $ref: "#/components/messages/camera"
      camera_notice:
        $ref: "#/components/messages/camera_notice"
      event:
        $ref: "#/components/messages/event"
      error:
        $ref: "#/components/messages/error"

operations:
  sendOffer:
    action: send
    channel:
      $ref: "#/channels/peer_to_peer"
    messages:
      - $ref: "#/channels/peer_to_peer/messages/offer"
  recvAnswer:
    action: receive
    messages:
      - $ref: "#/channels/peer_to_peer/messages/answer"
    channel:
      $ref: "#/channels/peer_to_peer"
  sendAudioChunk_peer_to_peer:
    action: send
    channel:
      $ref: "#/channels/peer_to_peer"
    messages:
      - $ref: "#/channels/peer_to_peer/messages/audio_chunk"
  clearBuffer_peer_to_peer:
    action: send
    channel:
      $ref: "#/channels/peer_to_peer"
    messages:
      - $ref: "#/channels/peer_to_peer/messages/clear_buffer"
  finalMessage_peer_to_peer:
    action: send
    channel:
      $ref: "#/channels/peer_to_peer"
    messages:
      - $ref: "#/channels/peer_to_peer/messages/final_message"
  sendCamera_peer_to_peer:
    action: send
    channel:
      $ref: "#/channels/peer_to_peer"
    messages:
      - $ref: "#/channels/peer_to_peer/messages/camera"
  cameraNotice_peer_to_peer:
    action: receive
    channel:
      $ref: "#/channels/peer_to_peer"
    messages:
      - $ref: "#/channels/peer_to_peer/messages/camera_notice"
  event_peer_to_peer:
    action: receive
    channel:
      $ref: "#/channels/peer_to_peer"
    messages:
      - $ref: "#/channels/peer_to_peer/messages/event"
  error_peer_to_peer:
    action: receive
    channel:
      $ref: "#/channels/peer_to_peer"
    messages:
      - $ref: "#/channels/peer_to_peer/messages/error"

  recvLivekitInfo:
    action: receive
    channel:
      $ref: "#/channels/livekit"
    messages:
      - $ref: "#/channels/livekit/messages/livekit_join_info"
  sendAudioChunk_livekit:
    action: send
    channel:
      $ref: "#/channels/livekit"
    messages:
      - $ref: "#/channels/livekit/messages/audio_chunk"

  clearBuffer_livekit:
    action: send
    channel:
      $ref: "#/channels/livekit"
    messages:
      - $ref: "#/channels/livekit/messages/clear_buffer"
  finalMessage_livekit:
    action: send
    channel:
      $ref: "#/channels/livekit"
    messages:
      - $ref: "#/channels/livekit/messages/final_message"
  sendCamera_livekit:
    action: send
    channel:
      $ref: "#/channels/livekit"
    messages:
      - $ref: "#/channels/livekit/messages/camera"
  cameraNotice_livekit:
    action: receive
    channel:
      $ref: "#/channels/livekit"
    messages:
      - $ref: "#/channels/livekit/messages/camera_notice"
  event_livekit:
    action: receive
    channel:
      $ref: "#/channels/livekit"
    messages:
      - $ref: "#/channels/livekit/messages/event"
  error_livekit:
    action: receive
    channel:
      $ref: "#/channels/livekit"
    messages:
      - $ref: "#/channels/livekit/messages/error"

components:
  messages:
    rtc_offer:
      description: RTC Offer as generated by https://developer.mozilla.org/en-US/docs/Web/API/RTCPeerConnection/createOffer or compatible
      payload:
        schema:
          type: object
          properties:
            type:
              type: string
              const: "offer"
            sdp:
              type: string
    audio_chunk:
      description: Binary stream of the audio that the Avatar will lipsync to. Sent as a binary stream (in JS/TS UInt8Arr)
      contentType: application/octet-stream
      payload:
        schema:
          type: string
          format: bytestring
    clear_buffer:
      description: "Client Signal to make the avatar stop speaking immediately and ignore all previously sent audio"
      payload:
        schema:
          type: string
          const: SKIP
    final_message:
      description: "Client Signal to tell the server that the final segment of audio has been already sent and that it should close after playing it back"
      payload:
        schema:
          type: string
          const: DONE
    camera:
      description: |
        Moves the camera, Trinity-2 faces only. Sent as binary: the ASCII prefix `CAM_`, then little-endian float32 camera offsets on top of the avatar's own framing, in this order (y comes before x):

        | # | Field | Meaning | Supported range |
        |---|-------|---------|-----------------|
        | 1 | pos_y_off | Moves the avatar down, in half canvas heights | -10 to 10 |
        | 2 | pos_x_off | Moves the avatar right, in half canvas widths | -10 to 10 |
        | 3 | pos_z_off | Metres the camera backs away from the avatar (negative moves in) | -5 to 5 |
        | 4 | zoom | Multiplies the avatar's zoom; 1 is no change | above 0, up to 4 |
        | 5 | rot_x_off | Degrees the camera tilts up (pitch) | -180 to 180 |
        | 6 | rot_y_off | Degrees the camera pans right (yaw) | -180 to 180 |
        | 7 | rot_z_off | Degrees the camera rolls clockwise | -180 to 180 |
        | 8 | orbit_x_off | Degrees the camera orbits up over the avatar's head (elevation) | -80 to 80 |
        | 9 | orbit_y_off | Degrees the camera orbits round to its right (azimuth) | -180 to 180 |

        Send the first 4, the first 7 or all 9 values; the ones left off stay neutral (0).

        Each message replaces the whole camera, including the one the session started with (the session token's `camera`): the values are offsets from the avatar's own framing, not from the previous message. 0, 0, 0, 1, 0, 0, 0, 0, 0 returns to the avatar's own framing.

        The camera cuts to the new setting. To glide instead, append the ASCII tag `LERP` and one more float32: the seconds the move takes, from wherever the camera is now (part-way through an earlier glide, if one is running). 0 or less is a cut.

        A message is 20, 32 or 40 bytes, or 28, 40 or 48 with `LERP`. A value outside its supported range is still applied, with a `WARNING:` reply. Any other length, NaN or infinity is rejected and the camera stays where it is. See camera_notice.
      contentType: application/octet-stream
      payload:
        schema:
          type: string
          format: bytestring
    camera_notice:
      description: "Server replies to a camera message, sent as text. None of them end the session."
      payload:
        schema:
          type: string
          oneOf:
            - pattern: '^WARNING: .+$'
              description: "Values outside their supported range, applied as sent. Each reads `camera <field> <value> is outside its supported range [<low>, <high>]; applied as is` (zoom's range opens with `(`), separated by `; `."
            - const: "Invalid camera override received"
              description: "The payload was the wrong length, or held NaN or infinity. The camera is unchanged."
            - const: "Selected model does not support camera overrides"
              description: "The face is not Trinity-2. The camera is unchanged."
        example: "WARNING: camera zoom 6.0 is outside its supported range (0.0, 4.0]; applied as is"

    event:
      description: "Server sent signals"
      payload:
        schema:
          type: string
          enum:
            - START
            - ACK
            - STOP
            - SPEAK
            - SILENT
    rtc_answer:
      description: RTC Answer as generated by https://developer.mozilla.org/en-US/docs/Web/API/RTCPeerConnection/createAnswer or compatible. Will be received AFTER an offer has been sent
      payload:
        schema:
          type: object
          properties:
            type:
              type: string
              const: "answer"
            sdp:
              type: string
    livekit_join_info:
      description: Room info and join token that are used by the client to join a livekit room that hosts the avatar session
      payload:
        schema:
          type: object
          properties:
            livekit_url:
              type: string
              description: LiveKit server URL to join. For users pinned to a region this is that region's endpoint (e.g. wss://<project>.eu.rtc.livekit.cloud), so always connect to the URL in this message rather than a cached one.
            livekit_token:
              type: string
    error:
      description: Termination messages that specify the reason for immediate termination, including a routing error (Routing error, no EU Sessions available. EU ONLY PROCESSING enabled) when a region-pinned session lands on a machine outside its region
      payload:
        schema:
          type: string # Wrapping in an object often fixes the 'properties' read error
          oneOf:
            - pattern: '^(?i)ERROR\s+.+$'
              description: "Matches 'ERROR' regardless of casing."
            - pattern: '^(?i)RATE\s+.+$'
              description: "Matches 'RATE' followed by a space."
            - pattern: '^(?i)CLOSING\s+.+$'
              description: "Matches 'CLOSING' followed by a space."
        example: "ERROR: INVALID_API_KEY"
