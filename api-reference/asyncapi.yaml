asyncapi: 3.0.0
info:
  title: Simli WebSockets
  version: 1.0.0
servers:
  Simli WSS:
    host: "api.simli.ai"
    protocol: wss
    variables:
      session_token:
        description: Session token generated by https://api.simli.ai/compose/token

defaultContentType: text/plain
channels:
  peer_to_peer:
    summary: |
      Peer to Peer WebRTC 

      [Compose Session Token](/api-reference/compose-session-token) is sent as query parameter string

      enableSFU is a query parameter boolean (default true) to opt into sending the traffic through cloudflare network for improved reliability

      First message must be offer. Offer must be provided within 20 seconds of opening the websocket, or the session ends with `STOP REASON: failed to receive RTC Offer`. Once offer is sent, a corresponding answer will be sent from the server which can be used as described [here](https://developer.mozilla.org/en-US/docs/Web/API/RTCPeerConnection/setRemoteDescription)
    address: /compose/webrtc/p2p
    messages:
      offer:
        $ref: "#/components/messages/rtc_offer"
        description: "RTC Offer. Must be first message"
      answer:
        $ref: "#/components/messages/rtc_answer"
        description: "RTC Answer. Sent once your offer is in"
      audio_chunk:
        $ref: "#/components/messages/audio_chunk"
      play_immediate:
        $ref: "#/components/messages/play_immediate"
      clear_buffer:
        $ref: "#/components/messages/clear_buffer"
      final_message:
        $ref: "#/components/messages/final_message"
      camera:
        $ref: "#/components/messages/camera"
      camera_notice:
        $ref: "#/components/messages/camera_notice"
      background:
        $ref: "#/components/messages/background"
      foreground:
        $ref: "#/components/messages/foreground"
      asset_notice:
        $ref: "#/components/messages/asset_notice"
      video_metadata:
        $ref: "#/components/messages/video_metadata"
      event:
        $ref: "#/components/messages/event"
      endframe:
        $ref: "#/components/messages/endframe"
      error:
        $ref: "#/components/messages/error"

  livekit:
    summary: |
      Livekit Backed WebRTC

      [Compose Session Token](/api-reference/compose-session-token) is sent as query parameter string

      No first message is required. However, You must successfully join the livekit room within 60 seconds, or the session ends with `CLIENT NOT CONNECTED TO LIVEKIT ROOM, TERMINATED SESSION`
    address: /compose/webrtc/livekit
    messages:
      livekit_join_info:
        $ref: "#/components/messages/livekit_join_info"
      audio_chunk:
        $ref: "#/components/messages/audio_chunk"
      play_immediate:
        $ref: "#/components/messages/play_immediate"
      clear_buffer:
        $ref: "#/components/messages/clear_buffer"
      final_message:
        $ref: "#/components/messages/final_message"
      camera:
        $ref: "#/components/messages/camera"
      camera_notice:
        $ref: "#/components/messages/camera_notice"
      background:
        $ref: "#/components/messages/background"
      foreground:
        $ref: "#/components/messages/foreground"
      asset_notice:
        $ref: "#/components/messages/asset_notice"
      video_metadata:
        $ref: "#/components/messages/video_metadata"
      event:
        $ref: "#/components/messages/event"
      endframe:
        $ref: "#/components/messages/endframe"
      error:
        $ref: "#/components/messages/error"

operations:
  sendOffer:
    action: send
    channel:
      $ref: "#/channels/peer_to_peer"
    messages:
      - $ref: "#/channels/peer_to_peer/messages/offer"
  recvAnswer:
    action: receive
    messages:
      - $ref: "#/channels/peer_to_peer/messages/answer"
    channel:
      $ref: "#/channels/peer_to_peer"
  sendAudioChunk_peer_to_peer:
    action: send
    channel:
      $ref: "#/channels/peer_to_peer"
    messages:
      - $ref: "#/channels/peer_to_peer/messages/audio_chunk"
  playImmediate_peer_to_peer:
    action: send
    channel:
      $ref: "#/channels/peer_to_peer"
    messages:
      - $ref: "#/channels/peer_to_peer/messages/play_immediate"
  clearBuffer_peer_to_peer:
    action: send
    channel:
      $ref: "#/channels/peer_to_peer"
    messages:
      - $ref: "#/channels/peer_to_peer/messages/clear_buffer"
  finalMessage_peer_to_peer:
    action: send
    channel:
      $ref: "#/channels/peer_to_peer"
    messages:
      - $ref: "#/channels/peer_to_peer/messages/final_message"
  sendCamera_peer_to_peer:
    action: send
    channel:
      $ref: "#/channels/peer_to_peer"
    messages:
      - $ref: "#/channels/peer_to_peer/messages/camera"
  cameraNotice_peer_to_peer:
    action: receive
    channel:
      $ref: "#/channels/peer_to_peer"
    messages:
      - $ref: "#/channels/peer_to_peer/messages/camera_notice"
  sendBackground_peer_to_peer:
    action: send
    channel:
      $ref: "#/channels/peer_to_peer"
    messages:
      - $ref: "#/channels/peer_to_peer/messages/background"
  sendForeground_peer_to_peer:
    action: send
    channel:
      $ref: "#/channels/peer_to_peer"
    messages:
      - $ref: "#/channels/peer_to_peer/messages/foreground"
  assetNotice_peer_to_peer:
    action: receive
    channel:
      $ref: "#/channels/peer_to_peer"
    messages:
      - $ref: "#/channels/peer_to_peer/messages/asset_notice"
  videoMetadata_peer_to_peer:
    action: receive
    channel:
      $ref: "#/channels/peer_to_peer"
    messages:
      - $ref: "#/channels/peer_to_peer/messages/video_metadata"
  event_peer_to_peer:
    action: receive
    channel:
      $ref: "#/channels/peer_to_peer"
    messages:
      - $ref: "#/channels/peer_to_peer/messages/event"
  endframe_peer_to_peer:
    action: receive
    channel:
      $ref: "#/channels/peer_to_peer"
    messages:
      - $ref: "#/channels/peer_to_peer/messages/endframe"
  error_peer_to_peer:
    action: receive
    channel:
      $ref: "#/channels/peer_to_peer"
    messages:
      - $ref: "#/channels/peer_to_peer/messages/error"

  recvLivekitInfo:
    action: receive
    channel:
      $ref: "#/channels/livekit"
    messages:
      - $ref: "#/channels/livekit/messages/livekit_join_info"
  sendAudioChunk_livekit:
    action: send
    channel:
      $ref: "#/channels/livekit"
    messages:
      - $ref: "#/channels/livekit/messages/audio_chunk"
  playImmediate_livekit:
    action: send
    channel:
      $ref: "#/channels/livekit"
    messages:
      - $ref: "#/channels/livekit/messages/play_immediate"

  clearBuffer_livekit:
    action: send
    channel:
      $ref: "#/channels/livekit"
    messages:
      - $ref: "#/channels/livekit/messages/clear_buffer"
  finalMessage_livekit:
    action: send
    channel:
      $ref: "#/channels/livekit"
    messages:
      - $ref: "#/channels/livekit/messages/final_message"
  sendCamera_livekit:
    action: send
    channel:
      $ref: "#/channels/livekit"
    messages:
      - $ref: "#/channels/livekit/messages/camera"
  cameraNotice_livekit:
    action: receive
    channel:
      $ref: "#/channels/livekit"
    messages:
      - $ref: "#/channels/livekit/messages/camera_notice"
  sendBackground_livekit:
    action: send
    channel:
      $ref: "#/channels/livekit"
    messages:
      - $ref: "#/channels/livekit/messages/background"
  sendForeground_livekit:
    action: send
    channel:
      $ref: "#/channels/livekit"
    messages:
      - $ref: "#/channels/livekit/messages/foreground"
  assetNotice_livekit:
    action: receive
    channel:
      $ref: "#/channels/livekit"
    messages:
      - $ref: "#/channels/livekit/messages/asset_notice"
  videoMetadata_livekit:
    action: receive
    channel:
      $ref: "#/channels/livekit"
    messages:
      - $ref: "#/channels/livekit/messages/video_metadata"
  event_livekit:
    action: receive
    channel:
      $ref: "#/channels/livekit"
    messages:
      - $ref: "#/channels/livekit/messages/event"
  endframe_livekit:
    action: receive
    channel:
      $ref: "#/channels/livekit"
    messages:
      - $ref: "#/channels/livekit/messages/endframe"
  error_livekit:
    action: receive
    channel:
      $ref: "#/channels/livekit"
    messages:
      - $ref: "#/channels/livekit/messages/error"

components:
  messages:
    rtc_offer:
      description: RTC Offer as generated by https://developer.mozilla.org/en-US/docs/Web/API/RTCPeerConnection/createOffer or compatible
      payload:
        schema:
          type: object
          properties:
            type:
              type: string
              const: "offer"
            sdp:
              type: string
    audio_chunk:
      description: Binary stream of the audio that the Avatar will lipsync to. Sent as a binary stream (in JS/TS UInt8Arr)
      contentType: application/octet-stream
      payload:
        schema:
          type: string
          format: bytestring
    play_immediate:
      description: |
        Interrupts the avatar and plays new audio at once. Sent as binary: the ASCII prefix `PLAY_IMMEDIATE` (14 bytes), then audio in the same format as audio_chunk (PCM16, 16 kHz, mono), in one message.

        Everything you sent before it that the avatar hasn't spoken yet is dropped, as with SKIP, and this audio starts playing from where the avatar is now. Audio chunks you send after it play after it.

        Use it when the user interrupts and the reply is already in hand: one message drops the old audio and starts the new one, instead of a SKIP and then audio chunks. It can carry the whole reply, or just its start (Simli's reference client sends the first 4 seconds this way) with the rest following as ordinary audio chunks. An odd trailing byte is dropped. After DONE, it only interrupts: the audio in it isn't played.
      contentType: application/octet-stream
      payload:
        schema:
          type: string
          format: bytestring
    clear_buffer:
      description: "Client Signal to make the avatar stop speaking immediately and ignore all previously sent audio"
      payload:
        schema:
          type: string
          const: SKIP
    final_message:
      description: "Client Signal to tell the server that the final segment of audio has been already sent and that it should close after playing it back"
      payload:
        schema:
          type: string
          const: DONE
    camera:
      description: |
        Moves the camera, Trinity-2 faces only. Sent as binary: the ASCII prefix `CAM_`, then little-endian float32 camera offsets on top of the avatar's own framing, in this order (y comes before x):

        | # | Field | Meaning | Supported range |
        |---|-------|---------|-----------------|
        | 1 | pos_y_off | Moves the avatar down, in half canvas heights | -10 to 10 |
        | 2 | pos_x_off | Moves the avatar right, in half canvas widths | -10 to 10 |
        | 3 | pos_z_off | Metres the camera backs away from the avatar (negative moves in) | -5 to 5 |
        | 4 | zoom | Multiplies the avatar's zoom; 1 is no change | above 0, up to 4 |
        | 5 | rot_x_off | Degrees the camera tilts up (pitch) | -180 to 180 |
        | 6 | rot_y_off | Degrees the camera pans right (yaw) | -180 to 180 |
        | 7 | rot_z_off | Degrees the camera rolls clockwise | -180 to 180 |
        | 8 | orbit_x_off | Degrees the camera orbits up over the avatar's head (elevation) | -80 to 80 |
        | 9 | orbit_y_off | Degrees the camera orbits round to its right (azimuth) | -180 to 180 |

        Send the first 4, the first 7 or all 9 values; the ones left off stay neutral (0).

        Each message replaces the whole camera, including the one the session started with (the session token's `camera`): the values are offsets from the avatar's own framing, not from the previous message. 0, 0, 0, 1, 0, 0, 0, 0, 0 returns to the avatar's own framing.

        The camera cuts to the new setting. To glide instead, append the ASCII tag `LERP` and one more float32: the seconds the move takes, from wherever the camera is now (part-way through an earlier glide, if one is running). 0 or less is a cut.

        A message is 20, 32 or 40 bytes, or 28, 40 or 48 with `LERP`. A value outside its supported range is still applied, with a `WARNING:` reply. Any other length, NaN or infinity is rejected and the camera stays where it is. See camera_notice.
      contentType: application/octet-stream
      payload:
        schema:
          type: string
          format: bytestring
    camera_notice:
      description: "Server replies to a camera message, sent as text. None of them end the session."
      payload:
        schema:
          type: string
          oneOf:
            - pattern: '^WARNING: .+$'
              description: "Values outside their supported range, applied as sent. Each reads `camera <field> <value> is outside its supported range [<low>, <high>]; applied as is` (zoom's range opens with `(`), separated by `; `."
            - const: "Invalid camera override received"
              description: "The payload was the wrong length, or held NaN or infinity. The camera is unchanged."
            - const: "Selected model does not support camera overrides"
              description: "The face is not Trinity-2. The camera is unchanged."
        example: "WARNING: camera zoom 6.0 is outside its supported range (0.0, 4.0]; applied as is"
    background:
      description: |
        Puts one of your uploaded backgrounds behind the avatar, Trinity-2 faces only: the ASCII prefix `BG_` and the background's id, as `POST /assets/backgrounds` returned it, 36 characters (hyphens included, either case). Text or binary; 39 characters in all, nothing else is accepted. An image can't be sent: upload it first. The background is cropped to fill the session's canvas.

        Only your own backgrounds: an id that isn't one of your account's is ignored. It replaces the one the session started with (the session token's `background_id`) a moment later, once loaded; audio keeps playing meanwhile, and the last one sent wins. See asset_notice.

        `BG_00000000-0000-0000-0000-000000000000` (the nil UUID) goes back to the avatar's own background, at once.
      payload:
        schema:
          type: string
          pattern: '^BG_[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
        example: "BG_6f1c2a9e-1b2c-4d3e-8f90-0123456789ab"
    foreground:
      description: |
        Lays one of your uploaded foregrounds over the avatar through its transparency, Trinity-2 faces only: the ASCII prefix `FG_` and the foreground's id, as `POST /assets/foregrounds` returned it, 36 characters. Text or binary; 39 characters in all, nothing else is accepted, an image least of all. Otherwise as background, in place of the session token's `foreground_id`. `FG_00000000-0000-0000-0000-000000000000` (the nil UUID) takes the foreground away.
      payload:
        schema:
          type: string
          pattern: '^FG_[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
        example: "FG_6f1c2a9e-1b2c-4d3e-8f90-0123456789ab"
    asset_notice:
      description: "Server replies to a background or foreground message, sent as text; a message that is applied gets none. None of them end the session, and the avatar keeps what it had."
      payload:
        schema:
          type: string
          oneOf:
            - pattern: '^Invalid (background|foreground) message: .+$'
              description: "Not `BG_`/`FG_` and an id of 36 characters (an image, say)."
            - pattern: '^(background|foreground) \S+ is not one of your uploaded (backgrounds|foregrounds), ignoring$'
              description: "No such id among your account's uploads of that kind: never uploaded, deleted, or another account's."
            - pattern: "^Couldn't load (background|foreground) \\S+, ignoring$"
              description: "It couldn't be fetched or read just now; send it again."
            - pattern: '^Selected model does not support a custom (background|foreground)$'
              description: "The face is not Trinity-2."
        example: "background 6f1c2a9e-1b2c-4d3e-8f90-0123456789ab is not one of your uploaded backgrounds, ignoring"

    video_metadata:
      description: "Sent as JSON text once the session is set up, just before START. `fps`, `width` and `height` are integers: the frame rate and size of the video Simli streams. For a Trinity-2 face, `width` x `height` is the session token's `streaming_width` x `streaming_height`, an odd side rounded up by a pixel, at 25 fps. A Trinity-1 face streams 512 x 512 at 25 fps."
      payload:
        schema:
          type: object
          required:
            - video_metadata
          properties:
            video_metadata:
              type: object
              required:
                - fps
                - width
                - height
              properties:
                fps:
                  type: integer
                  description: Frames per second
                width:
                  type: integer
                  description: Video width in pixels
                height:
                  type: integer
                  description: Video height in pixels
        example:
          video_metadata:
            fps: 25
            width: 768
            height: 768
    endframe:
      description: "Sent as text when the session ends, just before `CLOSING REASON: <reason>` and STOP: `ENDFRAME:` and the number of video frames the session streamed, an integer (the video's running time times its fps)."
      payload:
        schema:
          type: string
          pattern: '^ENDFRAME:[0-9]+$'
        example: "ENDFRAME:1500"
    event:
      description: "Server sent signals"
      payload:
        schema:
          type: string
          enum:
            - START
            - ACK
            - STOP
            - SPEAK
            - SILENT
    rtc_answer:
      description: RTC Answer as generated by https://developer.mozilla.org/en-US/docs/Web/API/RTCPeerConnection/createAnswer or compatible. Will be received AFTER an offer has been sent
      payload:
        schema:
          type: object
          properties:
            type:
              type: string
              const: "answer"
            sdp:
              type: string
    livekit_join_info:
      description: Room info and join token that are used by the client to join a livekit room that hosts the avatar session
      payload:
        schema:
          type: object
          properties:
            livekit_url:
              type: string
              description: LiveKit server URL to join. For users pinned to a region this is that region's endpoint (e.g. wss://<project>.eu.rtc.livekit.cloud), so always connect to the URL in this message rather than a cached one.
            livekit_token:
              type: string
    error:
      description: Termination messages that specify the reason for immediate termination, including a routing error (Routing error, no EU Sessions available. EU ONLY PROCESSING enabled) when a region-pinned session lands on a machine outside its region
      payload:
        schema:
          type: string # Wrapping in an object often fixes the 'properties' read error
          oneOf:
            - pattern: '^(?i)ERROR\s+.+$'
              description: "Matches 'ERROR' regardless of casing."
            - pattern: '^(?i)RATE\s+.+$'
              description: "Matches 'RATE' followed by a space."
            - pattern: '^(?i)CLOSING\s+.+$'
              description: "Matches 'CLOSING' followed by a space."
        example: "ERROR: INVALID_API_KEY"
